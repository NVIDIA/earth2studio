site_name: Earth2Studio
site_description: Open-source deep-learning framework for exploring, building and deploying AI weather and climate workflows.
site_url: https://nvidia.github.io/earth2studio/
repo_name: NVIDIA/earth2studio
repo_url: https://github.com/NVIDIA/earth2studio
edit_uri: edit/main/docs/
docs_dir: docs
exclude_docs: |
  _build/**
  overrides/**
site_dir: site
strict: false
copyright: Copyright &copy; 2024-2026 NVIDIA Corporation & Affiliates
theme:
  name: material
  custom_dir: docs/overrides
  logo: _static/nvidia-logo-horiz-rgb-wht-for-screen.svg
  favicon: _static/favicon.ico
  language: en
  font:
    text: NVIDIA Sans
    code: NVIDIA Sans
  features:
  - announce.dismiss
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.indexes
  - navigation.top
  - navigation.footer
  - search.highlight
  - search.suggest
  - toc.follow
  - content.code.copy
  - content.code.annotate
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: black
    accent: light green
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: black
    accent: light green
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
extra_css:
- https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css
- assets/stylesheets/nvidia-material.css
- assets/stylesheets/earth2studio-gallery.css
extra_javascript:
- assets/javascripts/e2s-landing.js
- assets/javascripts/e2s-install-selector.js
- assets/javascripts/e2s-catalog.js
- assets/javascripts/mathjax.js
- https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
extra:
  version:
    provider: mike
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/NVIDIA/earth2studio
    name: Earth2Studio on GitHub
markdown_extensions:
- mkdocs_badges.zensical
- admonition
- attr_list
- md_in_html
- tables
- toc:
    permalink: true
- pymdownx.arithmatex:
    generic: true
- pymdownx.details
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- pymdownx.magiclink:
    hide_protocol: true
    repo_url_shortener: true
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
plugins:
- autorefs
- search
- mkdocstrings:
    enable_inventory: true
    handlers:
      python:
        paths:
        - .
        - earth2studio/models
        inventories:
        - https://docs.python.org/3/objects.inv
        - https://numpy.org/doc/stable/objects.inv
        - https://pandas.pydata.org/docs/objects.inv
        - https://pytorch.org/docs/stable/objects.inv
        - https://docs.xarray.dev/en/stable/objects.inv
        - https://filesystem-spec.readthedocs.io/en/latest/objects.inv
        - https://developmentseed.org/obstore/latest/objects.inv
        options:
          allow_inspection: true
          docstring_section_style: list
          docstring_style: numpy
          inherited_members: true
          line_length: 60
          separate_signature: true
          show_signature_annotations: true
          show_source: false
          show_symbol_type_toc: true
          signature_crossrefs: true
          extensions:
          - docs/griffe_extensions.py:StripBadgesSection
          - griffe_inherited_docstrings
- badges:
