- earth2studio-gallery:
    examples_dir: examples
    output_dir: examples
    cache_dir: .e2sgallery
    execute: never
    jobs: 1
    fail_fast: true
    optimize_images: true
    generate_notebooks: true
    output_open: true
    collect_telemetry: true
    backreferences: true
- blog:
    blog_dir: blog
    post_dir: '{blog}/posts'
    post_date_format: medium
    archive: true
    categories: true
- mike:
    deploy_prefix: v
    alias_type: redirect
hooks:
- docs/mkdocs_hooks.py
nav:
- Home: index.md
- User Guide:
  - Install: userguide/about/install.md
  - Overview: userguide/about/overview.md
