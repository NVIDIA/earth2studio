# Navigation for the current version, kept next to the content it references.
# Referenced from the `versions:` list in ../docs.yml. Paths are relative to this file.
#
# Mirrors the MkDocs `nav:` in /mkdocs.yml (tab order: Home, User Guide, API, Examples,
# Blog, Changelog). Not migrated yet: the Scorecards tab (plugin-generated).
# Blog archive/category pages are plugin-generated and are replaced by the post list on the blog index.

tabs:
  home:
    display-name: Home
    skip-slug: true
  user-guide:
    display-name: User Guide
    skip-slug: true          # Tab adds no URL segment (/install, not /user-guide/install).
  api:
    display-name: API
    slug: api                # Pages live under /api/<group>/<page>.
  examples:
    display-name: Examples
    skip-slug: true          # Section slug below already provides /examples.
  blog:
    display-name: Blog
    skip-slug: true          # Section slug below already provides /blog.
  changelog:
    display-name: Changelog
    href: https://github.com/NVIDIA/earth2studio/blob/main/CHANGELOG.md

navigation:
  - tab: home
    layout:
      - page: Home
        path: ../../docs/index.mdx
        slug: /              # "/" makes this the version's landing page.
