defaults:
  manager: uv
  source: github
  sources:
    uv: github
    pip: pypi
  category: base
  item: core

package:
  name: earth2studio
  github: https://github.com/NVIDIA/earth2studio.git
  release_ref: 0.17.0
  main_ref: main

managers:
  - id: uv
    label: uv
    description: Recommended for new Earth2Studio environments.
  - id: pip
    label: pip
    description: Standard Python package installer.

sources:
  - id: pypi
    label: PyPI
    description: Install the latest published release.
  - id: github
    label: GitHub
    description: Install from the latest release tag.
  - id: github-main
    label: GitHub main
    description: Install the current development branch.

command_templates:
  pypi:
    uv: 'uv add "{requirement}"'
    pip: 'pip install "{requirement}"'
  github:
    uv: 'uv add "{requirement} @ git+{github}@{release_ref}"'
    pip: 'pip install "{requirement} @ git+{github}@{release_ref}"'
  github-main:
    uv: 'uv add "{requirement} @ git+{github}@{main_ref}"'
    pip: 'pip install "{requirement} @ git+{github}@{main_ref}"'

categories:
  - id: base
    label: Base Package
    description: Core package installs and broad dependency groups.
    items:
      - id: core
        label: Core package
        extra:
        summary: Core Earth2Studio APIs, workflows, coordinates, and IO interfaces.
        notes:
          - Most model and data backends are not included in the base install.

  - id: prognostic
    label: Prognostic Models
    description: Forecast models that advance atmospheric state.
    items:
      - id: ace2
        label: ACE-2
        extra: ace2
        summary: ACE-2 model dependencies.
        api_refs:
          - earth2studio.models.px.ACE2ERA5
      - id: aifs
        label: AIFS
        extra: aifs
        summary: ECMWF AIFS model dependencies.
        api_refs:
          - earth2studio.models.px.AIFS
        warnings:
          - text: Depends on flash-attn, which can take a long time to build.
            href: https://github.com/Dao-AILab/flash-attention
            label: flash-attn
      - id: aifsens
        label: AIFS Ensemble
        extra: aifsens
        summary: ECMWF AIFS ensemble model dependencies.
        api_refs:
          - earth2studio.models.px.AIFSENS
        warnings:
          - Depends on flash-attn, which can take a long time to build.
      - id: aifs2
        label: AIFS 2.0
        extra: aifs2
        summary: ECMWF AIFS 2.0 model dependencies.
        api_refs:
          - earth2studio.models.px.AIFS2
        warnings:
          - Depends on flash-attn, which can take a long time to build.
      - id: aifs2ens
        label: AIFS 2.0 Ensemble
        extra: aifs2ens
        summary: ECMWF AIFS 2.0 ensemble model dependencies.
        api_refs:
          - earth2studio.models.px.AIFS2ENS
        warnings:
          - Depends on flash-attn, which can take a long time to build.
      - id: atlas
        label: Atlas
        extra: atlas
        summary: NVIDIA Atlas model dependencies.
        api_refs:
          - earth2studio.models.px.Atlas
        warnings:
          - Depends on natten for Python versions before 3.14, which can take a long
            time to build.
      - id: aurora
        label: Aurora
        extra: aurora
        summary: Microsoft Aurora model dependencies.
        api_refs:
          - earth2studio.models.px.Aurora
          - earth2studio.models.px.Aurora1p5
          - earth2studio.models.px.Aurora1p5Ensemble
      - id: dlesym
        label: DLESyM
        extra: dlesym
        summary: DLESyM model dependencies.
        api_refs:
          - earth2studio.models.px.DLESyM
          - earth2studio.models.px.DLESyMLatLon
          - earth2studio.models.px.DLESyMv0_ISCCP_ERA5
          - earth2studio.models.px.DLESyMv0_ISCCP_ERA5LatLon
          - earth2studio.models.dx.DLESyMv0_ISCCP_ERA5Precip
      - id: dlwp
        label: DLWP
        extra: dlwp
        summary: DLWP model dependencies.
        api_refs:
          - earth2studio.models.px.DLWP
      - id: fcn
        label: FourCastNet
        extra: fcn
        summary: FourCastNet model dependencies.
        api_refs:
          - earth2studio.models.px.FCN
      - id: fcn3
        label: FourCastNet 3
        extra: fcn3
        summary: FourCastNet 3 model dependencies.
        api_refs:
          - earth2studio.models.px.FCN3
        preinstall:
          pip:
            - 'export FORCE_CUDA_EXTENSION=1'
            - 'pip install --no-build-isolation "torch-harmonics @ git+https://github.com/NVIDIA/torch-harmonics.git@a632ca748a12bd9f74dbc1e00653317810991f74"'
            - 'pip install "makani @ git+https://github.com/NVIDIA/makani.git@b38fcb2799d7dbc146fa60459f3f9823394a8bf1"'
          uv:
            default:
              - 'export FORCE_CUDA_EXTENSION=1'
            pypi:
              - 'export FORCE_CUDA_EXTENSION=1'
              - 'uv add --no-build-isolation "torch-harmonics @ git+https://github.com/NVIDIA/torch-harmonics.git@a632ca748a12bd9f74dbc1e00653317810991f74"'
              - 'uv add "makani @ git+https://github.com/NVIDIA/makani.git@b38fcb2799d7dbc146fa60459f3f9823394a8bf1"'
        notes:
          - CUDA extensions are recommended for best performance.
      - id: fengwu
        label: FengWu
        extra: fengwu
        summary: FengWu model dependencies.
        api_refs:
          - earth2studio.models.px.FengWu
        notes:
          - text: Requires ONNX Runtime GPU.
            href: https://onnxruntime.ai/docs/install/#python-installs
            label: ONNX Runtime GPU install docs
      - id: fuxi
        label: FuXi
        extra: fuxi
        summary: FuXi model dependencies.
        api_refs:
          - earth2studio.models.px.FuXi
        notes:
          - text: Requires ONNX Runtime GPU.
            href: https://onnxruntime.ai/docs/install/#python-installs
            label: ONNX Runtime GPU install docs
      - id: fuxi-s2s
        label: FuXi-S2S
        extra: fuxi-s2s
        summary: FuXi-S2S model dependencies.
        api_refs:
          - earth2studio.models.px.FuXiS2S
        warnings:
          - text: The official checkpoint is restricted to research use.
            href: https://zenodo.org/records/15718402
            label: FuXi-S2S checkpoint license and usage restrictions
        notes:
          - text: Requires ONNX Runtime GPU.
            href: https://onnxruntime.ai/docs/install/#python-installs
            label: ONNX Runtime GPU install docs
          - The wrapper expects two consecutive UTC daily means on its native
            1.5-degree grid and does not aggregate hourly fields or regrid inputs.
          - Each forecast trajectory is a stochastic ensemble member; use the Zero
            perturbation with Earth2Studio ensemble workflows.
      - id: gencast
        label: GenCast
        extra: gencast
        summary: Google DeepMind GenCast model dependencies.
        api_refs:
          - earth2studio.models.px.GenCastMini
        preinstall:
          pip:
            - 'pip install "weathernext @ git+https://github.com/google-deepmind/weathernext.git@9c034db1ff412d5db6cbe6bb0c5c9afc5a267719"'
          uv:
            pypi:
              - 'uv add "weathernext @ git+https://github.com/google-deepmind/weathernext.git@9c034db1ff412d5db6cbe6bb0c5c9afc5a267719"'
        notes:
          - GenCast uses WeatherNext and requires Python 3.12 or newer.
      - id: graphcast
        label: GraphCast
        extra: graphcast
        summary: Google DeepMind GraphCast model dependencies.
        api_refs:
          - earth2studio.models.px.GraphCastOperational
          - earth2studio.models.px.GraphCastSmall
        preinstall:
          pip:
            - 'pip install "weathernext @ git+https://github.com/google-deepmind/weathernext.git@9c034db1ff412d5db6cbe6bb0c5c9afc5a267719"'
          uv:
            pypi:
              - 'uv add "weathernext @ git+https://github.com/google-deepmind/weathernext.git@9c034db1ff412d5db6cbe6bb0c5c9afc5a267719"'
        notes:
          - GraphCast uses WeatherNext and requires Python 3.12 or newer.
      - id: interp-modafno
        label: InterpModAFNO
        extra: interp-modafno
        summary: Interpolation wrapper dependencies for AFNO-style prognostic models.
        api_refs:
          - earth2studio.models.px.InterpModAFNO
      - id: pangu
        label: Pangu
        extra: pangu
        summary: Pangu model dependencies.
        api_refs:
          - earth2studio.models.px.Pangu24
          - earth2studio.models.px.Pangu6
          - earth2studio.models.px.Pangu3
        notes:
          - text: Requires ONNX Runtime GPU.
            href: https://onnxruntime.ai/docs/install/#python-installs
            label: ONNX Runtime GPU install docs
      - id: sfno
        label: SFNO
        extra: sfno
        summary: SFNO model dependencies.
        api_refs:
          - earth2studio.models.px.SFNO
        preinstall:
          pip:
            - 'pip install --no-build-isolation "torch-harmonics @ git+https://github.com/NVIDIA/torch-harmonics.git@a632ca748a12bd9f74dbc1e00653317810991f74"'
            - 'pip install "makani @ git+https://github.com/NVIDIA/makani.git@b38fcb2799d7dbc146fa60459f3f9823394a8bf1"'
          uv:
            pypi:
              - 'uv add --no-build-isolation "torch-harmonics @ git+https://github.com/NVIDIA/torch-harmonics.git@a632ca748a12bd9f74dbc1e00653317810991f74"'
              - 'uv add "makani @ git+https://github.com/NVIDIA/makani.git@b38fcb2799d7dbc146fa60459f3f9823394a8bf1"'
      - id: stormcast
        label: StormCast
        extra: stormcast
        summary: StormCast model dependencies.
        api_refs:
          - earth2studio.models.px.StormCast
      - id: stormcast-conus
        label: StormCast-CONUS
        extra: stormcast-conus
        summary: StormCast-CONUS model dependencies.
        api_refs:
          - earth2studio.models.px.StormCastCONUS
        # TODO: Removed with psn release 2.2.0
        preinstall:
          pip:
            - 'pip install "nvidia-physicsnemo@git+https://github.com/NVIDIA/physicsnemo.git@bf0ad4f43275b84a7beab35127d57a99cd359260"'
          uv:
            pypi:
              - 'uv add "nvidia-physicsnemo@git+https://github.com/NVIDIA/physicsnemo.git@bf0ad4f43275b84a7beab35127d57a99cd359260"'
        warnings:
          - Depends on natten for Python versions before 3.14, which can take a long
            time to build.
      - id: stormscope
        label: StormScope
        extra: stormscope
        summary: StormScope model dependencies.
        api_refs:
          - earth2studio.models.px.StormScopeGOES
          - earth2studio.models.px.StormScopeMRMS
          - earth2studio.models.dx.StormScopeDxNSRDB
        warnings:
          - Depends on natten for Python versions before 3.14, which can take a long
            time to build.
      - id: ucast
        label: UCast
        extra: ucast
        summary: UCast model dependencies.
        api_refs:
          - earth2studio.models.px.UCast

  - id: diagnostic
    label: Diagnostic Models
    description: Models that derive, downscale, track, or infer diagnostic products.
    items:
      - id: cbottle
        label: CBottle
        extra: cbottle
        summary: CBottle diagnostic and video model dependencies.
        api_refs:
          - earth2studio.models.dx.CBottleInfill
          - earth2studio.models.dx.CBottleSR
          - earth2studio.models.dx.CBottleTCGuidance
          - earth2studio.models.px.CBottleVideo
      - id: climatenet
        label: ClimateNet
        extra: climatenet
        summary: ClimateNet diagnostic model dependencies.
        api_refs:
          - earth2studio.models.dx.ClimateNet
      - id: corrdiff
        label: CorrDiff
        extra: corrdiff
        summary: CorrDiff diagnostic model dependencies.
        api_refs:
          - earth2studio.models.dx.CorrDiffCMIP6
          - earth2studio.models.dx.CorrDiffTaiwan
      - id: cosmo
        label: CorrDiff COSMO-ERA5
        extra: cosmo
        summary: CorrDiff COSMO-ERA5 model dependencies.
        api_refs:
          - earth2studio.models.dx.CorrDiffCosmoEra5
        # TODO: Removed with psn release 2.2.0
        preinstall:
          pip:
            - 'pip install "nvidia-physicsnemo@git+https://github.com/NVIDIA/physicsnemo.git@bf0ad4f43275b84a7beab35127d57a99cd359260"'
          uv:
            pypi:
              - 'uv add "nvidia-physicsnemo@git+https://github.com/NVIDIA/physicsnemo.git@bf0ad4f43275b84a7beab35127d57a99cd359260"'
        warnings:
          - Depends on natten for Python versions before 3.14.
      - id: cyclone
        label: Cyclone Trackers
        extra: cyclone
        summary: Tropical cyclone tracker dependencies.
        api_refs:
          - earth2studio.models.dx.TCTrackerVitart
          - earth2studio.models.dx.TCTrackerWuDuan
        notes:
          - TempestExtremes is not provided as a Python library and must be installed
            separately when using the tracker workflows.
      - id: derived
        label: Derived
        extra: derived
        summary: Derived diagnostic model dependencies.
        api_refs:
          - earth2studio.models.dx.DerivedRHDewpoint
          - earth2studio.models.dx.DerivedRH
          - earth2studio.models.dx.DerivedSurfacePressure
          - earth2studio.models.dx.DerivedTCWV
          - earth2studio.models.dx.DerivedVPD
          - earth2studio.models.dx.DerivedWS
      - id: orbit
        label: ORBIT-2
        extra: orbit
        summary: ORBIT-2 diagnostic model dependencies.
        api_refs:
          - earth2studio.models.dx.OrbitGlobalPrecip
      - id: precip-afno
        label: Precipitation AFNO
        extra: precip-afno
        summary: Precipitation AFNO diagnostic model dependencies.
        api_refs:
          - earth2studio.models.dx.PrecipitationAFNO
      - id: precip-afno-v2
        label: Precipitation AFNO V2
        extra: precip-afno-v2
        summary: Precipitation AFNO V2 diagnostic model dependencies.
        api_refs:
          - earth2studio.models.dx.PrecipitationAFNOv2
        warnings:
          - Precipitation AFNO V2 is deprecated and performs worse than V1.
      - id: solarradiation-afno
        label: Solar Radiation AFNO
        extra: solarradiation-afno
        summary: Solar Radiation AFNO diagnostic model dependencies.
        api_refs:
          - earth2studio.models.dx.SolarRadiationAFNO1H
          - earth2studio.models.dx.SolarRadiationAFNO6H
      - id: windgust-afno
        label: Windgust AFNO
        extra: windgust-afno
        summary: Windgust AFNO diagnostic model dependencies.
        api_refs:
          - earth2studio.models.dx.WindgustAFNO

  - id: data-assimilation
    label: Data Assimilation
    description: Data assimilation model dependencies.
    warnings:
      - Data assimilation APIs are currently in beta and may change in future releases.
      - Data assimilation extras install CUDA-dependent CuPy and cuDF packages.
    items:
      - id: da-healda
        label: HealDA
        extra: da-healda
        summary: HealDA dependencies.
        api_refs:
          - earth2studio.models.da.HealDA
      - id: da-interp
        label: InterpEquirectangular
        extra: da-interp
        summary: Interpolation data assimilation dependencies.
        api_refs:
          - earth2studio.models.da.InterpEquirectangular
      - id: da-stormcast
        label: StormCast SDA
        extra: da-stormcast
        summary: StormCast data assimilation dependencies.
        api_refs:
          - earth2studio.models.da.StormCastSDA

  - id: data
    label: Data
    description: Data source dependencies for analysis, forecast, satellite, and
      tabular data.
    items:
      - id: data
        label: Data Sources
        extra: data
        summary: Data source dependencies for analysis, forecast, satellite, and
          tabular data.

  - id: perturbation
    label: Perturbation
    description: Perturbation method dependencies.
    items:
      - id: perturbation
        label: Perturbation
        extra: perturbation
        summary: Perturbation method dependencies.

  - id: statistics
    label: Statistics
    description: Statistic and metric dependencies.
    items:
      - id: statistics
        label: Statistics
        extra: statistics
        summary: Statistic and metric dependencies.

  - id: utils
    label: Utilities
    description: Utility dependency group.
    items:
      - id: utils
        label: Utilities
        extra: utils
        summary: Utility dependency group.
