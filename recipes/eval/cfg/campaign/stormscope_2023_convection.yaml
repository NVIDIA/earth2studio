# @package _global_
# StormScope GOES + MRMS + GLM coupled nowcast — 3km / 10-minute timestep.
# Single IC at a known convective event to keep the smoke test tight.

defaults:
    - override /model: stormscope_goes_mrms

runner: stormscope
run_id: stormscope_2023_convection

start_times:
    - "2023-12-05 12:00:00"

nsteps: 6                   # 6 × 10min = 60min forecast

# ERA5 cannot verify GOES or MRMS channels; the runner's own observation
# sources do (see above).
data_source: null
predownload:
    verification:
        enabled: true

# The stormscope runner couples the two models (earth2studio.coupling.
# CoupledRunner; the GOES model feeds the radar model's conditioning) and
# binds its own sources per role (goes, mrms, and mrms_conditioning /
# goes_forcing when configured) from the models' default_sources(); the
# top-level data_source / ic_source are not used.
# Predownload writes <output.path>/goes.zarr and mrms.zarr, which the runner
# prefers when present.  Verification comes from the same GOES and MRMS
# observations at every forecast valid time: with data_source unset, the
# runner composes the two live sources and predownload writes them into
# verification.zarr, which score.py reads.  A bring-your-own
# verification_source replaces that.
#
# Bring-your-own data: set per-model source nodes delivering fields on the
# model grid (a predownloaded store, or a RegriddedSource around a raw source):
#
# model:
#     goes:
#         ic_source:
#             _target_: my_pkg.MyGoesZarrSource
#             path: /data/my_goes.zarr
#     mrms:
#         ic_source:
#             _target_: my_pkg.MyMrmsGlmZarrSource   # refc, refc_base, glm_density
#             path: /data/my_mrms.zarr
#         conditioning_source: null                  # the GOES model conditions MRMS
#
# GLM (glm_density) is a state channel: the MRMS default source composes MRMS
# radar with GOESGLMGrid lightning (bilinear onto the model grid) itself.

output:
    variables:
        # GOES ABI channels (8)
        - abi01c
        - abi02c
        - abi03c
        - abi07c
        - abi08c
        - abi09c
        - abi10c
        - abi13c
        # MRMS radar + GLM lightning
        - refc
        - refc_base
        - glm_density
    overwrite: true
    thread_writers: 0       # conservative while we validate multi-model writes
    chunks:
        time: 1
        lead_time: 1

scoring:
    variables: ${output.variables}
    metrics:
        rmse:
            _target_: earth2studio.statistics.rmse
            reduction_dimensions: [y, x]   # HRRR grid — not lat/lon
    lat_weights: false                      # no cosine(lat) on Lambert-conformal
    lead_time_chunk_size: null              # small rollout, no chunking needed
    # StormScope's HRRR sub-region has invalid grid points (outside the
    # NearestNeighborRegridder's max_dist_km mask) — verification zarrs hold
    # NaN there while predictions hold 0 (the model's prep_input zero-fills
    # its valid_mask).  Without this policy, (pred - truth) is NaN at every
    # invalid pixel and the spatial reduction collapses to NaN everywhere.
    # zero_fill replaces NaNs in both tensors with 0 before the metric runs,
    # so invalid points contribute 0 to the sum-of-squares.  The score is
    # biased low by sqrt(N_valid / N_total) — typically a few percent for
    # the HRRR CONUS sub-domain.
    nan_policy: zero_fill
    # Clamp both prediction and verification to each variable's physical
    # range before the metric runs.  MRMS encodes no-data pixels as
    # -9999, which otherwise dominate the sum-of-squares; with a valid
    # range of [0, 75] dBZ those pixels become 0 (matching the model's
    # zero-fill at invalid grid points) and contribute 0 to the RMSE.
    # GLM counts are non-negative; clamp the lower bound at 0.
    # Leave a bound null for a one-sided clamp.
    valid_ranges:
        refc: {min: 0}
        refc_base: {min: 0}
        glm_density: {min: 0}
        abi01c: {min: 0, max: 1.0}
        abi02c: {min: 0, max: 1.0}
        abi03c: {min: 0, max: 1.0}
        abi07c: {min: 200, max: 320}
        abi08c: {min: 200, max: 320}
        abi09c: {min: 200, max: 320}
        abi10c: {min: 200, max: 320}
        abi13c: {min: 200, max: 320}

# ---------------------------------------------------------------------------
# Report
# ---------------------------------------------------------------------------
# HRRR-native projection; prediction/verification zarrs carry y/x in meters.
# variable_groups keeps GOES channels, MRMS radar, and GLM in separate plots
# so the color scales don't collide.
report:
    title: "StormScope GOES+MRMS+GLM — 2023-12-05 Convection"

    variable_groups:
        goes_visible: [abi01c, abi02c, abi03c]
        goes_ir: [abi07c, abi08c, abi09c, abi10c, abi13c]
        mrms: [refc, refc_base]
        glm: [glm_density]

    projection: hrrr_lambert

    # Prediction zeros at HRRR-invalid pixels vs. verification NaNs at the
    # same pixels make the difference panel dominated by the fill-value
    # offset, not skill.  Hide it for this campaign.
    show_diff: false

    # 10-min stride, 1h rollout — days on the x-axis would compress every
    # tick near zero.  Minutes are readable.
    lead_time_axis_unit: minutes

    # Per-variable visualization color ranges.  Omit a key to auto-scale
    # (nanmin/nanmax).  MRMS refc in particular has large-negative no-data
    # fill values that otherwise crush the usable range, so we clamp to the
    # physical 0–75 dBZ window.  GLM is a sparse non-negative count field.
    color_ranges:
        refc:
            vmin: 0
            vmax: 75
            diff_abs: 40
        refc_base:
            vmin: 0
            vmax: 75
            diff_abs: 40
        glm_density:            # lightning event counts per cell
            vmin: 0
            vmax: 5
            diff_abs: 5
        abi01c:                 # visible reflectance — unitless 0..1
            vmin: 0
            vmax: 1.0
            diff_abs: 0.5
        abi02c:
            vmin: 0
            vmax: 1.0
            diff_abs: 0.5
        abi03c:
            vmin: 0
            vmax: 1.0
            diff_abs: 0.5
        abi07c:                 # IR brightness temperature (K)
            vmin: 200
            vmax: 320
            diff_abs: 30
        abi08c:
            vmin: 200
            vmax: 320
            diff_abs: 30
        abi09c:
            vmin: 200
            vmax: 320
            diff_abs: 30
        abi10c:
            vmin: 200
            vmax: 320
            diff_abs: 30
        abi13c:
            vmin: 200
            vmax: 320
            diff_abs: 30

    sections:
        - type: header_visualization
          variable: refc
          lead_time: "60 min"

        - type: summary_table
          lead_times: ["30 min", "60 min"]
          collapsed: false

        - type: lead_time_curves
          collapsed: false

        - type: visualization
          variables: [abi13c, refc, glm_density]
          lead_times: ["30 min", "60 min"]
          collapsed: true

        - type: ic_heatmap
          metrics: [rmse]
          collapsed: true

    figure_format: png
