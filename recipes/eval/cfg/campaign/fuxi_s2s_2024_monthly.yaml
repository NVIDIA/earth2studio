# Calendar-month archive example.  FuXi-S2S starts at 00 UTC on July 1 and
# September 1, 2024 and stores UTC calendar-month means in forecast.zarr.
# C3S and other seasonal hindcast archives use calendar months too.
# lead_time holds integer lead months: 0 is the start month, whose first day
# is the initial-condition analysis, and 1 the month after.  The July start
# stores July and August, and the September start stores September and
# October.  A start inside a month stores NaN for lead month 0.  Scoring
# happens elsewhere, since score.py and online scoring reject integer lead
# months.
defaults:
    - override /model: fuxi_s2s
    - override /data_source: arco_era5_daily

pipeline:
    _target_: src.pipelines.seasonal.WindowMeanForecastPipeline
    window: month
    months: 2                # lead months 0 and 1
    target_resolution: 1.0   # degrees; null keeps the model grid
run_id: fuxi_s2s_2024_monthly

start_times:
    - "2024-07-01 00:00:00"
    - "2024-09-01 00:00:00"

# July plus August is 62 days, so the July start needs daily means up to
# day 61.  September plus October is 61 days, so the September start needs
# day 60 and stops there.  Both run past the published 42-day horizon.
# Setup reports the minimum nsteps when a start needs more.
nsteps: 61

# Variables kept in forecast.zarr, one field per lead month.
output:
    variables: [t2m, t850, z500, msl, tp]
