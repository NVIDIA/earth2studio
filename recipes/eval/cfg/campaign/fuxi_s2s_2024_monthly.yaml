# Subseasonal archive example: FuXi-S2S rolled out 60 days from two initial
# conditions and stored as two 30-day means per run (forecast.zarr), for
# scoring elsewhere.  The model steps one day at a time on a 1.5 degree
# grid, so the 1 degree target keeps the model grid; a 0.25 degree model
# would be interpolated.  It consumes UTC calendar-day means, which the
# arco_era5_daily source serves for the two initial frames.  The published
# horizon is 42 days; `nsteps: 30` stays within it with one mean per run.
defaults:
    - override /model: fuxi_s2s
    - override /data_source: arco_era5_daily

pipeline:
    _target_: src.pipelines.seasonal.WindowMeanForecastPipeline
    window: 30D              # a whole number of model steps
    target_resolution: 1.0   # degrees; null keeps the model grid
run_id: fuxi_s2s_2024_monthly

start_times:
    - "2024-01-01 00:00:00"
    - "2024-01-15 00:00:00"

# 60 daily steps = two 30-day windows per run.
nsteps: 60

# Variables kept in forecast.zarr, one field per window.
output:
    variables: [t2m, t850, z500, msl, tp]
