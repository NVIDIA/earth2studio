# Monthly aggregations of FuXi-S2S forecasts, approximated by fixed 30-day
# windows.  Calendar-month means labelled by integer lead month, which the
# previous WindowMeanForecastPipeline(window='month') stored, are not
# supported by the window_mean runner: a stream's lead_time axis is a
# timedelta64 axis shared by every initial condition, and a calendar month
# has no fixed length.  Starting at 00 UTC on the 1st, window 1 covers days
# 1-30 of the start month and window 2 days 31-60, so the July start holds
# July 1-30 and July 31-August 29, and the September start September 1-30
# and October 1-30.  Scoring happens elsewhere.
defaults:
    - override /model: fuxi_s2s

runner:
    name: window_mean
    window: 30D              # a whole number of model steps
run_id: fuxi_s2s_2024_monthly

start_times:
    - "2024-07-01 00:00:00"
    - "2024-09-01 00:00:00"

# 60 daily steps = two 30-day windows per run, past the published 42-day
# horizon.
nsteps: 60

# Window means are stored for external scoring; no verification store.
predownload:
    verification:
        enabled: false

output:
    # Variables kept in forecast.zarr, one field per window.
    variables: [t2m, t850, z500, msl, tp]
    # 1 degree output grid; remove to keep the model's 1.5 degree grid.
    regrid:
        grid:
            lat: {start: 90, stop: -90, num: 181}
            lon: {start: 0, stop: 359, num: 360}
        method: bilinear
