# Monthly aggregations of FuXi-S2S forecasts, approximated by fixed 30-day
# windows.  The window_mean runner does not support calendar-month means
# labelled by integer lead month: a stream's lead_time axis is a
# timedelta64 axis shared by every initial condition, and a calendar month
# has no fixed length.  A FuXi-S2S daily mean carries the 00 UTC stamp of
# the day it covers, so the first lead from a 00 UTC start is the next
# day's mean, and a window holds the 30 daily means after its start (the
# lead-0 initial condition enters no window): window 1 covers days 2-31
# and window 2 days 32-61.  The July start holds July 2-31 and August
# 1-30, the September start September 2-October 1 and October 2-31; each
# window's lead label (30D, 60D) is the day of its last daily mean.
# Scoring happens elsewhere.
defaults:
    - override /model: fuxi_s2s

runner:
    name: window_mean
    window: 30D              # a whole number of model steps
run_id: fuxi_s2s_2024_monthly

start_times:
    - "2024-07-01 00:00:00"
    - "2024-09-01 00:00:00"

# 60 daily steps = two 30-day windows per run, past the published 42-day
# horizon.
nsteps: 60

# Window means are stored for external scoring; no verification store.
predownload:
    verification:
        enabled: false

output:
    # Variables kept in forecast.zarr, one field per window.  FuXi-S2S
    # outputs carry the model's qualified daily-mean labels.
    variables:
        - t2m:mean:-1h:23h
        - t850:mean:-1h:23h
        - z500:mean:-1h:23h
        - msl:mean:-1h:23h
        - tp:mean:0h:24h
    # 1 degree output grid; remove to keep the model's 1.5 degree grid.
    regrid:
        grid:
            lat: {start: 90, stop: -90, num: 181}
            lon: {start: 0, stop: 359, num: 360}
        method: bilinear
