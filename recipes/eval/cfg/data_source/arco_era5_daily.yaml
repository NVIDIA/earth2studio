# UTC calendar-day means of ARCO ERA5, for daily-mean models (FuXi-S2S).
# A request for 2024-01-15 00:00 returns the mean of the 24 hourly fields of
# that day; `cadence: 6h` is the four-sample approximation of the FuXi-S2S
# example at a quarter of the download.  Accumulations (tp, ttr) average the
# hourly totals ending 00 to 23 UTC, one hour earlier than the model's
# documented convention.  Sea-surface temperature stays NaN over land, as
# the model requires.  Predownload interpolates the means onto the model grid.
_target_: src.data.WindowMeanSource
window: 24h
cadence: 1h
align: start
source:
    _target_: earth2studio.data.ARCO_ERA5
    cache: false
    verbose: false
