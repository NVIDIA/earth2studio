# StormScope coupled GOES + MRMS + GLM nowcasting (3km / 10-min default).
# The stormscope runner (src/runners/stormscope.py) drives both models:
#   * StormScopeGOES forecasts the eight ABI channels.  The 3km_10min variant
#     is "pure obs" — no external conditioning source.
#   * StormScopeMRMS forecasts radar reflectivity ([refc, refc_base]) plus a
#     gridded GLM lightning channel (glm_density), conditioned on GOES
#     (observations at IC, then the GOES model's own predictions).
# Both operate on the HRRR Lambert-conformal grid (y, x) and are written as
# the streams `goes` and `mrms` of forecast.zarr.
#
# Data sources are the models' own default_sources(): GOES-East CONUS imagery
# and MRMS radar, regridded nearest-neighbour onto the model grid within the
# checkpoint's max_dist_km, plus GOESGLMGrid lightning regridded bilinearly and
# composed into the MRMS state.  Predownload writes one store per source role:
#   goes.zarr              GOES observation history (also MRMS conditioning)
#   mrms.zarr              radar + GLM history
# Bring-your-own sources replace a role with `ic_source:` / `conditioning_source:`
# nodes below; they must already deliver fields on the model grid (for example a
# predownloaded store, or earth2studio.data.RegriddedSource around a raw source).
# The stormscope runner couples the two models with
# earth2studio.coupling.CoupledRunner: the GOES model feeds the radar model's
# GOES conditioning slot, from its observed history at initialization and from
# its forecast at every later step.  Members batch on a leading ensemble axis;
# the runner seeds each model once per work item from the item's first member,
# under the model's own offset of random_seed (rule X5), so member_batch: 1
# reproduces each member exactly.

goes:
    architecture: earth2studio.models.px.StormScopeGOES
    load_args:
        model_name: 3km_10min
        # Mixed precision + torch.compile of the diffusion experts.  compile
        # is REQUIRED at this domain size: it makes NATTEN's flex attention
        # build a sparse block mask, whereas the eager path materializes a
        # dense [B, H, Q, KV] mask and OOMs (tens of GiB) on the full HRRR
        # 3km grid.  Matches the notebook example's load_model settings.
        amp: true
        compile: true
    # ic_source: null          # GOES history on the model grid (model default)
    # forcing_source: null     # only for conditioned variants (6km_1hr): GFS_FX
    # perturbation: null       # ensemble runs only: an earth2studio.perturbation
    #                          # node applied to this model's initial condition

mrms:
    architecture: earth2studio.models.px.StormScopeMRMS
    load_args:
        model_name: 3km_10min
        # See the GOES block: compile is required to avoid the dense NATTEN
        # flex-attention mask OOM at this domain size.
        amp: true
        compile: true
    # ic_source: null            # radar + GLM history on the model grid (model default)
    # conditioning_source: null  # GOES history frames the GOES model does not hold
    #                            # (a radar history longer than the GOES one); the
    #                            # GOES model itself conditions the radar model.
    #                            # Default: the GOES source above (one store).
    # perturbation: null         # ensemble runs only, as for the GOES model

# Optional regional view, applied to both models with the same padding so
# their grids keep matching (earth2studio.grids.Region.box order):
# region:
#     kind: box
#     params: [-100.0, 30.0, -90.0, 40.0]   # west, south, east, north
region: null
