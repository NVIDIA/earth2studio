# FuXi-S2S subseasonal prognostic (ONNX checkpoint of the publication).
# One model step advances one day on a 1.5 degree grid (121 x 240).  The
# state is a UTC calendar-day mean labelled 00:00 of that day, and the two
# initial frames must be daily means too: pair it with
# `override /data_source: arco_era5_daily`.  The graph samples its own
# perturbations, so every trajectory is one stochastic member.
architecture: earth2studio.models.px.FuXiS2S
# Omit package_path to use the default Hugging Face mirror of the checkpoint.
# package_path: /path/to/custom/checkpoint
