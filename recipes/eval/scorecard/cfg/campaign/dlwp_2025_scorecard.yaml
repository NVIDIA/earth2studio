# ---------------------------------------------------------------------------
# DLWP — 14-day scorecard, ERA5 2025, scored online.
#
# Scores computed for 48 ICs — four per month on the 1st/8th/15th/22nd at
# 00/06/12/18 UTC respectively with 14-day window, monthly and regional
# splits.  Scored ONLINE
# (stats.zarr -> scores.zarr, output.retain: none); scores carry a
# `region` axis (global + continental boxes on the ERA5 grid).
#
# Details:
#   * 7 scored variables (every model output that ERA5 provides)
#   * 1 member — deterministic
#   * 56 steps of 6 h, native 721x1440 [90,-90] grid (no regridding)
#   * needs t-6h history, so it keeps its own IC store.
# ---------------------------------------------------------------------------
defaults:
# Regional splits (bands, headline boxes, continents) — one shared choice for every
# scorecard campaign, defined in cfg/regions/standard.yaml.
- /regions/standard
- override /model: null   # self-contained: the model is defined right here
model:
    architecture: earth2studio.models.px.DLWP
project: dlwp
run_id: 2025_scorecard
# Four ICs per month at 00/06/12/18 UTC (see header).
start_times:
    - "2025-01-01 00:00:00"
    - "2025-01-08 06:00:00"
    - "2025-01-15 12:00:00"
    - "2025-01-22 18:00:00"
    - "2025-02-01 00:00:00"
    - "2025-02-08 06:00:00"
    - "2025-02-15 12:00:00"
    - "2025-02-22 18:00:00"
    - "2025-03-01 00:00:00"
    - "2025-03-08 06:00:00"
    - "2025-03-15 12:00:00"
    - "2025-03-22 18:00:00"
    - "2025-04-01 00:00:00"
    - "2025-04-08 06:00:00"
    - "2025-04-15 12:00:00"
    - "2025-04-22 18:00:00"
    - "2025-05-01 00:00:00"
    - "2025-05-08 06:00:00"
    - "2025-05-15 12:00:00"
    - "2025-05-22 18:00:00"
    - "2025-06-01 00:00:00"
    - "2025-06-08 06:00:00"
    - "2025-06-15 12:00:00"
    - "2025-06-22 18:00:00"
    - "2025-07-01 00:00:00"
    - "2025-07-08 06:00:00"
    - "2025-07-15 12:00:00"
    - "2025-07-22 18:00:00"
    - "2025-08-01 00:00:00"
    - "2025-08-08 06:00:00"
    - "2025-08-15 12:00:00"
    - "2025-08-22 18:00:00"
    - "2025-09-01 00:00:00"
    - "2025-09-08 06:00:00"
    - "2025-09-15 12:00:00"
    - "2025-09-22 18:00:00"
    - "2025-10-01 00:00:00"
    - "2025-10-08 06:00:00"
    - "2025-10-15 12:00:00"
    - "2025-10-22 18:00:00"
    - "2025-11-01 00:00:00"
    - "2025-11-08 06:00:00"
    - "2025-11-15 12:00:00"
    - "2025-11-22 18:00:00"
    - "2025-12-01 00:00:00"
    - "2025-12-08 06:00:00"
    - "2025-12-15 12:00:00"
    - "2025-12-22 18:00:00"
nsteps: 56           # 56 x 6h = 14 days
ensemble_size: 1
resume: true
perturbation: null
require_predownload: true
data_source:
    _target_: earth2studio.data.ARCO_ERA5
    cache: false
    verbose: false
output:
    path: ${oc.env:SCORECARD_OUT,/code/earth2studio_eval/recipes/eval/scorecard/models/dlwp/outputs}/${project}_${run_id}
    # Online scoring: never write the raw forecast store; stats.zarr is
    # the artifact.
    retain: none
    thread_writers: 4
    chunks:
        time: 1
        lead_time: 1
    variables:
    - t2m
    - tcwv
    - z300
    - z500
    - z700
    - z1000
    - t850
scoring:
    mode: online
    variables: ${output.variables}
    lat_weights: true
    # Deterministic run: the online path derives mse/rmse, bias and corr
    # from the accumulated sums, plus the opt-ins below — the ensemble
    # statistics (CRPS, spread, rank histogram) are skipped for M = 1.
    online:
        # Per-member MAE and radially averaged log spectral distance (dB)
        # vs ERA5 — the scorecard's deterministic panel.  The regional
        # splits come from the defaults entry /regions/standard above;
        # LSD is spectral, hence global-only (NaN in the boxed regions).
        mae: true
        lsd: true
    resume: true
predownload:
    verification:
        # Verification is already predownloaded; the run dir symlinks it.
        enabled: false
