# ---------------------------------------------------------------------------
# Persistence baseline — 14-day scorecard, ERA5 2025, scored online.
#
# The forecast at every lead time is the initial condition (identity
# model, earth2studio.models.px.Persistence).  Same 48 ICs, window,
# verification and regional splits as every model campaign; shown in the
# docs plots as a reference line rather than as its own scorecard page.
# ---------------------------------------------------------------------------
defaults:
# Regional splits (bands, headline boxes, continents) — one shared choice for every
# scorecard campaign, defined in cfg/regions/standard.yaml.
- /regions/standard
- override /model: null   # self-contained: the model is defined right here
model:
    architecture: scorecard.utils.baselines.PersistenceBaseline
    load_args:
        variables: ${output.variables}
project: persistence
run_id: 2025_scorecard
# Four ICs per month at 00/06/12/18 UTC (see header).
start_times:
    - "2025-01-01 00:00:00"
    - "2025-01-08 06:00:00"
    - "2025-01-15 12:00:00"
    - "2025-01-22 18:00:00"
    - "2025-02-01 00:00:00"
    - "2025-02-08 06:00:00"
    - "2025-02-15 12:00:00"
    - "2025-02-22 18:00:00"
    - "2025-03-01 00:00:00"
    - "2025-03-08 06:00:00"
    - "2025-03-15 12:00:00"
    - "2025-03-22 18:00:00"
    - "2025-04-01 00:00:00"
    - "2025-04-08 06:00:00"
    - "2025-04-15 12:00:00"
    - "2025-04-22 18:00:00"
    - "2025-05-01 00:00:00"
    - "2025-05-08 06:00:00"
    - "2025-05-15 12:00:00"
    - "2025-05-22 18:00:00"
    - "2025-06-01 00:00:00"
    - "2025-06-08 06:00:00"
    - "2025-06-15 12:00:00"
    - "2025-06-22 18:00:00"
    - "2025-07-01 00:00:00"
    - "2025-07-08 06:00:00"
    - "2025-07-15 12:00:00"
    - "2025-07-22 18:00:00"
    - "2025-08-01 00:00:00"
    - "2025-08-08 06:00:00"
    - "2025-08-15 12:00:00"
    - "2025-08-22 18:00:00"
    - "2025-09-01 00:00:00"
    - "2025-09-08 06:00:00"
    - "2025-09-15 12:00:00"
    - "2025-09-22 18:00:00"
    - "2025-10-01 00:00:00"
    - "2025-10-08 06:00:00"
    - "2025-10-15 12:00:00"
    - "2025-10-22 18:00:00"
    - "2025-11-01 00:00:00"
    - "2025-11-08 06:00:00"
    - "2025-11-15 12:00:00"
    - "2025-11-22 18:00:00"
    - "2025-12-01 00:00:00"
    - "2025-12-08 06:00:00"
    - "2025-12-15 12:00:00"
    - "2025-12-22 18:00:00"

nsteps: 56
ensemble_size: 1
resume: true
perturbation: null
require_predownload: true
data_source:
    _target_: earth2studio.data.ARCO_ERA5
    cache: false
    verbose: false
# Reuse the fcn3 campaign's predownloaded stores (initial conditions and
# ERA5 verification) rather than refetching them: both baselines share the
# grid, times and variables with that campaign.  Override SCORECARD_MODELS
# when the fcn3 run lives outside this checkout's models/ directory.
ic_source:
    _target_: src.data.PredownloadedSource
    store_path: ${oc.env:SCORECARD_MODELS,/code/earth2studio_eval/recipes/eval/scorecard/models}/fcn3/outputs/fcn3_2025_scorecard/data.zarr
verification_source:
    _target_: src.data.PredownloadedSource
    store_path: ${oc.env:SCORECARD_MODELS,/code/earth2studio_eval/recipes/eval/scorecard/models}/fcn3/outputs/fcn3_2025_scorecard/verification.zarr
output:
    path: ${oc.env:SCORECARD_OUT,/code/earth2studio_eval/recipes/eval/scorecard/models/persistence/outputs}/${project}_${run_id}
    # Online scoring: never write the raw forecast store; stats.zarr is
    # the artifact.
    retain: none
    thread_writers: 4
    chunks:
        time: 1
        lead_time: 1
    variables:
        - u10m
        - v10m
        - u100m
        - v100m
        - t2m
        - msl
        - tcwv
        - u50
        - u100
        - u150
        - u200
        - u250
        - u300
        - u400
        - u500
        - u600
        - u700
        - u850
        - u925
        - u1000
        - v50
        - v100
        - v150
        - v200
        - v250
        - v300
        - v400
        - v500
        - v600
        - v700
        - v850
        - v925
        - v1000
        - z50
        - z100
        - z150
        - z200
        - z250
        - z300
        - z400
        - z500
        - z600
        - z700
        - z850
        - z925
        - z1000
        - t50
        - t100
        - t150
        - t200
        - t250
        - t300
        - t400
        - t500
        - t600
        - t700
        - t850
        - t925
        - t1000
        - q50
        - q100
        - q150
        - q200
        - q250
        - q300
        - q400
        - q500
        - q600
        - q700
        - q850
        - q925
        - q1000
scoring:
    mode: online
    variables: ${output.variables}
    lat_weights: true
    # Deterministic baseline: the online path derives mse/rmse, bias and
    # corr from the accumulated sums, plus the opt-ins below.
    online:
        mae: true
        lsd: true
    resume: true
predownload:
    verification:
        # Verification is BYO from the fcn3 campaign's store above.
        enabled: false
