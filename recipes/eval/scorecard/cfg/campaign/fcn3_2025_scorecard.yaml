# ---------------------------------------------------------------------------
# FCN3 14-day scorecard — ERA5 2025, 16-member ensemble, 24 initial conditions.
#
#   24 ICs (1st and 15th of each month, 00 UTC) x 16 members = 384 work items
#   -> 48 items per rank on 8 GPUs
#   nsteps 56 x 6h = 336h = 14 days, so lead_time spans 0h..336h (57 values)
#
# Pure recipe path: ARCO_ERA5 + predownload.py. No custom DataSource.
#
# Run (from this directory):
#   ./run_scorecard.sh fcn3_2025_scorecard
# ---------------------------------------------------------------------------
defaults:
    - override /model: null   # self-contained: the model is defined below

project: fcn3
run_id: 2025_scorecard

# NGC rather than the HuggingFace default: anonymous HF pulls from the
# cluster's shared egress IP hit a 429 rate limit. Same Apache-2.0 checkpoint.
model:
    architecture: earth2studio.models.px.FCN3
    package_path: ngc://models/nvidia/earth-2/fourcastnet3@0.1.0

# Two ICs per month — the 1st and the 15th, 00 UTC.
start_times:
    - "2025-01-01 00:00:00"
    - "2025-01-15 00:00:00"
    - "2025-02-01 00:00:00"
    - "2025-02-15 00:00:00"
    - "2025-03-01 00:00:00"
    - "2025-03-15 00:00:00"
    - "2025-04-01 00:00:00"
    - "2025-04-15 00:00:00"
    - "2025-05-01 00:00:00"
    - "2025-05-15 00:00:00"
    - "2025-06-01 00:00:00"
    - "2025-06-15 00:00:00"
    - "2025-07-01 00:00:00"
    - "2025-07-15 00:00:00"
    - "2025-08-01 00:00:00"
    - "2025-08-15 00:00:00"
    - "2025-09-01 00:00:00"
    - "2025-09-15 00:00:00"
    - "2025-10-01 00:00:00"
    - "2025-10-15 00:00:00"
    - "2025-11-01 00:00:00"
    - "2025-11-15 00:00:00"
    - "2025-12-01 00:00:00"
    - "2025-12-15 00:00:00"

nsteps: 56           # 56 x 6h = 14 days
ensemble_size: 16
random_seed: 42

# Resume is on so an expired allocation can be picked up mid-campaign.
# Progress markers live in <output.path>/.progress/ — clear them (or bump
# run_id) if the data source ever changes, or completed items are skipped.
resume: true

# FCN3 is intrinsically stochastic: the recipe calls set_rng(seed=item.seed)
# per member, so members diverge through the model's own calibrated noise.
# An IC perturbation would double-count it.
perturbation: null

# ---------------------------------------------------------------------------
# Data — ARCO_ERA5, cached by predownload.py.
#
# verification.source is set EXPLICITLY so verification goes to its own
# verification.zarr. Since every one of the model's 72 channels is scored here,
# that store is the dominant cost: ~1,300 unique valid times x 72 variables
# fetched from ARCO_ERA5. Narrowing `scoring.variables` below `output.variables`
# would cut it proportionally, at the price of a narrower scorecard.
# ---------------------------------------------------------------------------
data_source:
    _target_: earth2studio.data.ARCO_ERA5
    cache: false
    verbose: false

require_predownload: true

predownload:
    overwrite: false
    verification:
        enabled: true
        source:
            _target_: earth2studio.data.ARCO_ERA5
            cache: false
            verbose: false

output:
    path: ${oc.env:SCORECARD_OUT,/code/earth2studio_eval/recipes/eval/scorecard/models/fcn3/outputs}/${project}_${run_id}
    overwrite: false     # paired with resume: true
    thread_writers: 4
    chunks:
        time: 1
        lead_time: 1
    # Zarr v3 writes uncompressed by default. At 72 vars x 16 members x 24 ICs
    # x 57 leads that is 6.2 TB; byte-shuffle + zstd typically brings it to
    # ~2 TB at negligible write cost, since float32 geophysical fields are
    # smooth. Handled by src/output.py::_build_codecs.
    compression:
        cname: zstd
        clevel: 3
        shuffle: shuffle
    variables:
        - u10m
        - v10m
        - u100m
        - v100m
        - t2m
        - msl
        - tcwv
        - u50
        - u100
        - u150
        - u200
        - u250
        - u300
        - u400
        - u500
        - u600
        - u700
        - u850
        - u925
        - u1000
        - v50
        - v100
        - v150
        - v200
        - v250
        - v300
        - v400
        - v500
        - v600
        - v700
        - v850
        - v925
        - v1000
        - z50
        - z100
        - z150
        - z200
        - z250
        - z300
        - z400
        - z500
        - z600
        - z700
        - z850
        - z925
        - z1000
        - t50
        - t100
        - t150
        - t200
        - t250
        - t300
        - t400
        - t500
        - t600
        - t700
        - t850
        - t925
        - t1000
        - q50
        - q100
        - q150
        - q200
        - q250
        - q300
        - q400
        - q500
        - q600
        - q700
        - q850
        - q925
        - q1000

scoring:
    variables: ${output.variables}
    lat_weights: true
    # MUST be small here. The prediction chunk is
    #   ensemble x chunk x variables x lat x lon x 4 B
    # = 16 x N x 72 x 721 x 1440 x 4, and CRPS sorts along the ensemble axis,
    # needing a second copy. The recipe's default of 8 is sized for ~17 vars
    # and 4 members (~2.3 GB); at 72 vars x 16 members that same 8 is 35.6 GiB
    # for x alone and OOMs an 80 GB H100. 1 -> 4.5 GiB, comfortable.
    lead_time_chunk_size: 1
    # Every metric comes from earth2studio.statistics or the recipe's own
    # src.metrics — nothing is reimplemented. The keys are load-bearing:
    # src/report/aggregation.py keys its aggregation off these exact names
    # (`rmse` -> sqrt(mean(x^2)), `ensemble_mean_mse` -> sqrt(mean(x))).
    metrics:
        # `rmse` (earth2studio.statistics.rmse) is inherited from
        # cfg/default.yaml via Hydra's dict merge — do not redeclare an
        # equivalent `mse`, or the summary table gets two "RMSE" columns.
        # Radially averaged 2D log spectral distance vs ERA5, in dB --
        # 0 means identical power spectra; growth shows blurring/smoothing.
        lsd:
            _target_: earth2studio.statistics.log_spectral_distance
            # Per-member spectra vs ERA5 (the metric requires the ensemble
            # dim declared when the forecast has one).
            ensemble_dimension: ensemble
            reduction_dimensions: []
        ensemble_mean_mse:
            _target_: src.metrics.mse
            ensemble_dimension: ensemble
            reduction_dimensions: [lat, lon]
        ensemble_variance:
            _target_: src.metrics.ensemble_variance
            ensemble_dimension: ensemble
            reduction_dimensions: [lat, lon]
        crps:
            _target_: earth2studio.statistics.crps
            ensemble_dimension: ensemble
            reduction_dimensions: [lat, lon]
    resume: true

report:
    title: "FCN3 14-day Scorecard — ERA5 2025 (24 ICs, 16 members)"
    projection: robinson
    figure_format: png

    sections:
        - type: header_visualization
          variable: z500
          lead_time: "5 days"

        - type: summary_table
          lead_times: ["1 days", "3 days", "5 days", "7 days", "10 days", "14 days"]
          variables: [t2m, z500, u10m, t850, msl]
          collapsed: false

        - type: lead_time_curves
          collapsed: true

        - type: lead_time_curves
          time_groups: true
          title_suffix: "Seasonal Breakdown"
          collapsed: true

        - type: spread_skill
          mse_metric: ensemble_mean_mse
          variance_metric: ensemble_variance
          variables: [t2m, z500, u10m, t850]
          collapsed: true

        - type: ic_heatmap
          metrics: [rmse, crps]
          variables: [z500, t2m, msl]
          collapsed: true

        - type: visualization
          variables: [z500, t2m]
          lead_times: ["1 days", "5 days", "10 days", "14 days"]
          collapsed: true

    variable_groups:
        geopotential: [z500, z850]
        temperature: [t500, t850]
        850_wind: [u850, v850]
        10m_wind: [u10m, v10m]

    time_groups:
        DJF:
            - start: "2025-01-01"
              end: "2025-02-28"
            - start: "2025-12-01"
              end: "2025-12-31"
        MAM:
            - start: "2025-03-01"
              end: "2025-05-31"
        JJA:
            - start: "2025-06-01"
              end: "2025-08-31"
        SON:
            - start: "2025-09-01"
              end: "2025-11-30"
