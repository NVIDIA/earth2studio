# ---------------------------------------------------------------------------
# FuXi — 14-day scorecard, ERA5 2025, scored online.
#
# Scores computed for 48 ICs — four per month on the 1st/8th/15th/22nd at
# 00/06/12/18 UTC respectively with 14-day window, monthly and regional
# splits.  Scored ONLINE
# (stats.zarr -> scores.zarr, output.retain: none); scores carry a
# `region` axis (global + continental boxes on the ERA5 grid).
#
# Details:
#   * 57 scored variables (every model output that ERA5 provides; not scored: r100, r1000, r150, r200, r250, r300, r400, r50, r500, r600, r700, r850, r925)
#   * 1 member — deterministic
#   * 56 steps of 6 h, native 721x1440 [90,-90] grid (no regridding)
#   * needs t-6h history, so it keeps its own IC store (NCAR ERA5: ARCO lacks r levels).
# ---------------------------------------------------------------------------
defaults:
# Regional splits (bands, headline boxes, continents) — one shared choice for every
# scorecard campaign, defined in cfg/regions/standard.yaml.
- /regions/standard
- override /model: null   # self-contained: the model is defined right here
model:
    architecture: earth2studio.models.px.FuXi
project: fuxi
run_id: 2025_scorecard
# Four ICs per month at 00/06/12/18 UTC (see header).
start_times:
    - "2025-01-01 00:00:00"
    - "2025-01-08 06:00:00"
    - "2025-01-15 12:00:00"
    - "2025-01-22 18:00:00"
    - "2025-02-01 00:00:00"
    - "2025-02-08 06:00:00"
    - "2025-02-15 12:00:00"
    - "2025-02-22 18:00:00"
    - "2025-03-01 00:00:00"
    - "2025-03-08 06:00:00"
    - "2025-03-15 12:00:00"
    - "2025-03-22 18:00:00"
    - "2025-04-01 00:00:00"
    - "2025-04-08 06:00:00"
    - "2025-04-15 12:00:00"
    - "2025-04-22 18:00:00"
    - "2025-05-01 00:00:00"
    - "2025-05-08 06:00:00"
    - "2025-05-15 12:00:00"
    - "2025-05-22 18:00:00"
    - "2025-06-01 00:00:00"
    - "2025-06-08 06:00:00"
    - "2025-06-15 12:00:00"
    - "2025-06-22 18:00:00"
    - "2025-07-01 00:00:00"
    - "2025-07-08 06:00:00"
    - "2025-07-15 12:00:00"
    - "2025-07-22 18:00:00"
    - "2025-08-01 00:00:00"
    - "2025-08-08 06:00:00"
    - "2025-08-15 12:00:00"
    - "2025-08-22 18:00:00"
    - "2025-09-01 00:00:00"
    - "2025-09-08 06:00:00"
    - "2025-09-15 12:00:00"
    - "2025-09-22 18:00:00"
    - "2025-10-01 00:00:00"
    - "2025-10-08 06:00:00"
    - "2025-10-15 12:00:00"
    - "2025-10-22 18:00:00"
    - "2025-11-01 00:00:00"
    - "2025-11-08 06:00:00"
    - "2025-11-15 12:00:00"
    - "2025-11-22 18:00:00"
    - "2025-12-01 00:00:00"
    - "2025-12-08 06:00:00"
    - "2025-12-15 12:00:00"
    - "2025-12-22 18:00:00"
nsteps: 56           # 56 x 6h = 14 days
ensemble_size: 1
resume: true
perturbation: null
require_predownload: false   # IC is BYO and verification is the shared store
# FuXi's inputs include relative humidity on 13 levels, which the ARCO ERA5
# store does not carry, and 6-hour accumulated precipitation (tp06), which
# the NCAR ERA5 mirror does not carry.  The initial conditions therefore
# come from a per-variable composite read on the fly (bring-your-own
# ``ic_source``, so no data.zarr): ARCO for everything but the r levels, the
# public NCAR ERA5 mirror (AWS Open Data) for r.  Verification stays on the
# shared ARCO-derived store (the r levels are not scored).
ic_source:
    _target_: src.data.CompositeSource
    # Qualified precipitation uses hourly ARCO samples; NCAR serves only r levels.
    time_step:
        _target_: numpy.timedelta64
        _args_: [1, h]
    sources:
        arco:
            _target_: earth2studio.data.ARCO_ERA5
            cache: false
            verbose: false
        ncar:
            _target_: earth2studio.data.NCAR_ERA5
            cache: true      # cache=false trips a double temp-dir removal in the source
            verbose: false
    variable_index:
        z50: arco
        z100: arco
        z150: arco
        z200: arco
        z250: arco
        z300: arco
        z400: arco
        z500: arco
        z600: arco
        z700: arco
        z850: arco
        z925: arco
        z1000: arco
        t50: arco
        t100: arco
        t150: arco
        t200: arco
        t250: arco
        t300: arco
        t400: arco
        t500: arco
        t600: arco
        t700: arco
        t850: arco
        t925: arco
        t1000: arco
        u50: arco
        u100: arco
        u150: arco
        u200: arco
        u250: arco
        u300: arco
        u400: arco
        u500: arco
        u600: arco
        u700: arco
        u850: arco
        u925: arco
        u1000: arco
        v50: arco
        v100: arco
        v150: arco
        v200: arco
        v250: arco
        v300: arco
        v400: arco
        v500: arco
        v600: arco
        v700: arco
        v850: arco
        v925: arco
        v1000: arco
        t2m: arco
        u10m: arco
        v10m: arco
        msl: arco
        tp: arco
        r50: ncar
        r100: ncar
        r150: ncar
        r200: ncar
        r250: ncar
        r300: ncar
        r400: ncar
        r500: ncar
        r600: ncar
        r700: ncar
        r850: ncar
        r925: ncar
        r1000: ncar
data_source:
    _target_: earth2studio.data.ARCO_ERA5
    cache: false
    verbose: false
output:
    path: ${oc.env:SCORECARD_OUT,/code/earth2studio_eval/recipes/eval/scorecard/models/fuxi/outputs}/${project}_${run_id}
    # Online scoring: never write the raw forecast store; stats.zarr is
    # the artifact.
    retain: none
    thread_writers: 4
    chunks:
        time: 1
        lead_time: 1
    variables:
    - msl
    - t2m
    - tp:sum:6h
    - u10m
    - v10m
    - z50
    - z100
    - z150
    - z200
    - z250
    - z300
    - z400
    - z500
    - z600
    - z700
    - z850
    - z925
    - z1000
    - t50
    - t100
    - t150
    - t200
    - t250
    - t300
    - t400
    - t500
    - t600
    - t700
    - t850
    - t925
    - t1000
    - u50
    - u100
    - u150
    - u200
    - u250
    - u300
    - u400
    - u500
    - u600
    - u700
    - u850
    - u925
    - u1000
    - v50
    - v100
    - v150
    - v200
    - v250
    - v300
    - v400
    - v500
    - v600
    - v700
    - v850
    - v925
    - v1000
scoring:
    mode: online
    variables: ${output.variables}
    lat_weights: true
    # Deterministic run: the online path derives mse/rmse, bias and corr
    # from the accumulated sums, plus the opt-ins below — the ensemble
    # statistics (CRPS, spread, rank histogram) are skipped for M = 1.
    online:
        # Per-member MAE and radially averaged log spectral distance (dB)
        # vs ERA5 — the scorecard's deterministic panel.  The regional
        # splits come from the defaults entry /regions/standard above;
        # LSD is spectral, hence global-only (NaN in the boxed regions).
        mae: true
        lsd: true
    resume: true
predownload:
    verification:
        # Verification is already predownloaded; the run dir symlinks it.
        enabled: false
