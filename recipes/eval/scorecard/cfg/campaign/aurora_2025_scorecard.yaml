# ---------------------------------------------------------------------------
# Aurora — 14-day scorecard, ERA5 2025. GENERATED by make_campaign.py.
#
# Identical to every other model in the scorecard: same 24 ICs
# (1st + 15th of each month), same 14-day window, same verification.
#
# Derived from the model, not chosen:
#   * 69 scored variables — the model's 69 outputs
#     intersected with the shared verification store.
#     All output variables have verification.
#   * 1 member(s) — deterministic
#   * 56 steps of 6 h
#   * output pole-padded onto ERA5's 721 grid so the SHARED verification store
#     is reused rather than refetching ~390 GB for this model alone.
#   * needs t-6h history, so it keeps its own IC store.
# ---------------------------------------------------------------------------
defaults:
- override /model: null   # self-contained: the model is defined right here
model:
    architecture: earth2studio.models.px.Aurora
project: aurora
run_id: 2025_scorecard
start_times:
- '2025-01-01 00:00:00'
- '2025-01-15 00:00:00'
- '2025-02-01 00:00:00'
- '2025-02-15 00:00:00'
- '2025-03-01 00:00:00'
- '2025-03-15 00:00:00'
- '2025-04-01 00:00:00'
- '2025-04-15 00:00:00'
- '2025-05-01 00:00:00'
- '2025-05-15 00:00:00'
- '2025-06-01 00:00:00'
- '2025-06-15 00:00:00'
- '2025-07-01 00:00:00'
- '2025-07-15 00:00:00'
- '2025-08-01 00:00:00'
- '2025-08-15 00:00:00'
- '2025-09-01 00:00:00'
- '2025-09-15 00:00:00'
- '2025-10-01 00:00:00'
- '2025-10-15 00:00:00'
- '2025-11-01 00:00:00'
- '2025-11-15 00:00:00'
- '2025-12-01 00:00:00'
- '2025-12-15 00:00:00'
nsteps: 56
ensemble_size: 1
resume: true
perturbation: null
require_predownload: true
data_source:
  _target_: earth2studio.data.ARCO_ERA5
  cache: false
  verbose: false
output:
  path: ${oc.env:SCORECARD_OUT,/code/earth2studio_eval/recipes/eval/scorecard/models/aurora/outputs}/${project}_${run_id}
  thread_writers: 4
  chunks:
    time: 1
    lead_time: 1
  variables:
  - z1000
  - z925
  - z850
  - z700
  - z600
  - z500
  - z400
  - z300
  - z250
  - z200
  - z150
  - z100
  - z50
  - q1000
  - q925
  - q850
  - q700
  - q600
  - q500
  - q400
  - q300
  - q250
  - q200
  - q150
  - q100
  - q50
  - t1000
  - t925
  - t850
  - t700
  - t600
  - t500
  - t400
  - t300
  - t250
  - t200
  - t150
  - t100
  - t50
  - u1000
  - u925
  - u850
  - u700
  - u600
  - u500
  - u400
  - u300
  - u250
  - u200
  - u150
  - u100
  - u50
  - v1000
  - v925
  - v850
  - v700
  - v600
  - v500
  - v400
  - v300
  - v250
  - v200
  - v150
  - v100
  - v50
  - msl
  - u10m
  - v10m
  - t2m
scoring:
  variables: ${output.variables}
  lat_weights: true
  lead_time_chunk_size: 8
  metrics:
    mae:
      _target_: earth2studio.statistics.mae
      reduction_dimensions:
      - lat
      - lon
    # Radially averaged 2D log spectral distance vs ERA5, in dB --
    # 0 means identical power spectra; growth shows blurring/smoothing.
    lsd:
      _target_: earth2studio.statistics.log_spectral_distance
      reduction_dimensions: []
  resume: true
predownload:
  verification:
    enabled: true
    source:
      _target_: earth2studio.data.ARCO_ERA5
      cache: false
      verbose: false
pipeline:
  _target_: scorecard.utils.pipelines.RegriddedForecastPipeline
  target_lat:
    start: 90.0
    stop: -90.0
    num: 721
  target_lon:
    start: 0.0
    stop: 359.75
    num: 1440
  share_verification: true
