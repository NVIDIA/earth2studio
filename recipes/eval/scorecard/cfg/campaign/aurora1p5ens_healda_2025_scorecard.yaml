# Hourly rollout: 336 x 1 h = 14 days (the model yields every hour).
nsteps: 336
ensemble_size: 16
random_seed: 42
resume: true
perturbation: null
require_predownload: true
data_source:
    _target_: earth2studio.data.ARCO_ERA5
    cache: false
    verbose: false
output:
    path: ${oc.env:SCORECARD_OUT,/code/earth2studio_eval/recipes/eval/scorecard/models/aurora1p5ens_healda/outputs}/${project}_${run_id}
    # Online scoring: never write the raw forecast store; stats.zarr is
    # the artifact.
    retain: none
    thread_writers: 4
    chunks:
        time: 1
        lead_time: 1
    variables:
