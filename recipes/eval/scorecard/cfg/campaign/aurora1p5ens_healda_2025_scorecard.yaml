# ---------------------------------------------------------------------------
# Aurora 1.5 Ensemble — 14-day scorecard, HealDA v2 initial conditions
# generated online, ERA5 2025 target, 16-member ensemble, hourly leads,
# scored online.
#
# Identical to aurora1p5ens_2025_scorecard except the initial conditions:
# each one is assembled from two HealDA v2 analyses (t-6h and t) that the
# pipeline computes on the fly from NNJA observations, instead of ERA5.
# Verification is unchanged (hourly ARCO_ERA5), so scores are comparable with
# the ERA5-initialised campaign and include the analysis difference at lead
# time zero.
#
# Scores computed for 48 ICs — four per month on the 1st/8th/15th/22nd at
# 00/06/12/18 UTC respectively with 14-day window, monthly and regional
# splits -- the same 48 dates as the ERA5-initialised campaign.
#
# Details:
#   * HealDA v2 serves all 83 prognostic inputs: fill_missing_variables is
#     off, so a gap fails loudly instead of mixing in ERA5
#   * one analysis costs ~20 s on an H100 (13 s obs fetch + 7 s inference),
#     every rank of an ensemble group assembles the same two
#   * observations are fetched live from the public NNJA bucket into the
#     container-local cache (predownload.observations: off); the window is
#     [t-45h, t+3h], the model's trained default
#   * 83 scored variables, 16 members, 336 steps of 1 h, output pole-padded
#     onto ERA5's 721 grid — see aurora1p5ens_2025_scorecard
# ---------------------------------------------------------------------------
defaults:
# Regional splits (bands, headline boxes, continents) — one shared choice for every
# scorecard campaign, defined in cfg/regions/standard.yaml.
- /regions/standard
- override /model: null   # self-contained: the model is defined right here
# DA-initialised forecast: `model.da` produces the analyses, `model.forecast`
# rolls them out (src/pipelines/assimilation.py:AssimilationForecastPipeline).
model:
    da:
        architecture: earth2studio.models.da.HealDAv2
        # Local packages (exports/stage_packages.py): every rank resolves its
        # files at load time, and through hf:// that is one HuggingFace API
        # call per file per rank — 64 ranks exhaust the shared IP's budget.
        package_path: ${oc.env:E2S_PACKAGES,/code/earth2studio_eval/.cache/packages}/healda-v2
        # Observation frames stay pandas on the host; the model moves them.
        obs_device: cpu
        # Six attempts with doubling waits (~15 min): one rank giving up on a
        # transient bucket outage would take the whole window down.
        fetch_attempts: 6
        # One entry per HealDA v2 input stream, in input_coords() order:
        # prepbufr, gpsro, satwnd, then the satellite sensors in the model's
        # order.  NNJA wide frames reproduce the training recipe (see the
        # HealDAv2 docstring); the IR sounders read the channel subset the
        # checkpoint knows, hence `from_model`.
        obs_sources:
            # Download concurrency is kept low (defaults: 24/24/8 workers):
            # eight nodes fetch at once and the public bucket answers slowly
            # under load, so fewer parallel requests means fewer timeouts.
            prepbufr: &nnja_conv
                _target_: earth2studio.data.NNJAObsConv
                time_tolerance_hours: [-45, 3]
                original_event: true
                exclude_message_types: [SATWND]
                layout: wide
                verbose: false
                async_workers: 8
                retries: 5
            gpsro: *nnja_conv
            satwnd:
                _target_: earth2studio.data.NNJAObsSatwnd
                time_tolerance_hours: [-45, 3]
                layout: wide
                verbose: false
                async_workers: 8
                retries: 5
            atms: &nnja_sat
                _target_: earth2studio.data.NNJAObsSat
                time_tolerance_hours: [-45, 3]
                layout: wide
                verbose: false
                async_workers: 4
                retries: 5
                from_model:
                    sensor_indices: sensor_indices
            amsua: *nnja_sat
            amsub: *nnja_sat
            mhs: *nnja_sat
            airs: *nnja_sat
            iasi: *nnja_sat
            cris: *nnja_sat
    forecast:
        architecture: earth2studio.models.px.Aurora1p5Ensemble
        package_path: ${oc.env:E2S_PACKAGES,/code/earth2studio_eval/.cache/packages}/aurora1p5
    # HealDA v2 covers every Aurora 1.5 input; never fill from ERA5 silently.
    fill_missing_variables: false
project: aurora1p5ens_healda
run_id: 2025_scorecard
# Four ICs per month at 00/06/12/18 UTC (see header).
start_times:
