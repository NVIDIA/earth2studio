scoring:
    mode: online
    variables: ${output.variables}
    lat_weights: true
    # The online path derives its metric set from the accumulated
    # sufficient statistics (mse/rmse, ensemble_mean_mse, ensemble
    # variance, fair CRPS, rank reliability, bias, corr) plus the opt-ins
    # below — `scoring.metrics` does not apply here.
    online:
        # 16 members on one 8-GPU node: 2 members per rank -> one ensemble
        # group per node, so the CRPS member exchange stays on NVLink.
        members_per_rank: 2
        # Per-member MAE and radially averaged log spectral distance (dB)
        # vs ERA5.  The regional splits come from the defaults entry
        # /regions/standard above; LSD is spectral, hence global-only.
        mae: true
        lsd: true
    resume: true
# Verification is hourly ERA5 read straight from ARCO while scoring (the
# shared store is 6-hourly).  Nothing is predownloaded: the initial
# conditions are DA analyses and the observations are fetched live.
verification_source:
    _target_: earth2studio.data.ARCO_ERA5
    cache: false
    verbose: false
predownload:
    verification:
        enabled: false
    observations:
        enabled: false
pipeline:
    _target_: scorecard.utils.pipelines.RegriddedAssimilationForecastPipeline
    target_lat:
        start: 90.0
        stop: -90.0
        num: 721
    target_lon:
        start: 0.0
        stop: 359.75
        num: 1440
    share_verification: false
