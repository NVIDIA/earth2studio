# Reproduce members of melissa_wn2.yaml, e.g. to store their fields.
project: 'reproduce_melissa_wn2'
mode: 'reproduce_members'
model: 'wn2'
model_kwargs:
    checkpoint_member: 1
deterministic: False
random_seed: 7777

reproduce_members: [
                    ['2025-10-24 00:00:00',  0, '???'],
                    ['2025-10-24 00:00:00',  1, '???'],
                   ]

n_steps: 15
ensemble_size: 2
batch_size: 1

# IFS analysis from ECMWF's open data, which WeatherNext 2 was fine-tuned on.
# The IFS produces sea surface temperature (parameter 34, in ECMWF's licensed
# Set I), but the open data does not include it. Only WeatherNext 2 reads it, so
# for WN2 runs it is taken from ERA5 instead; models without it (FCN3, AIFS-ENS)
# never request it and get every variable from the IFS.
data_source:
    _target_: src.data.tc_hunt_data_utils.supplemented_source
    source:
        _target_: earth2studio.data.IFS
        # the open data bucket throttles requests: allow for retries
        async_timeout: 3600
    supplement:
        _target_: earth2studio.data.NCAR_ERA5
    variables: ['sst']

store_type: "none"
store_dir: "./outputs_${project}"

wn2_tracking: {}

cyclone_tracking:
    asynchronous: True
    detect_chunk_steps: 4  # DetectNodes runs while the model rolls out
    vars: ['msl', 'u10m', 'v10m', 'z300', 'z500']
    detect_cmd: 'DetectNodes --verbosity 0 --mergedist 6 --closedcontourcmd _DIFF(z300,z500),-58.8,6.5,0;msl,200.,5.5,0 --searchbymin msl --outputcmd msl,min,0;_VECMAG(u10m,v10m),max,5;height,min,0'
    stitch_cmd: 'StitchNodes --in_fmt lon,lat,msl,wind_speed,height --range 8.0 --mintime 54h --maxgap 4 --out_file_format csv --threshold wind_speed,>=,10.,10;lat,<=,50.,10;lat,>=,-50.,10;height,<=,150.,10'
    orography_path: https://huggingface.co/nvidia/fourcastnet3/blob/main/orography.nc
    keep_raw_data: False
    scratch_dir: null
    task_timeout_seconds: 120
    print_te_output: False
    max_workers_per_rank: 8

# hydra logs
hydra:
    job:
        name: ${project}
    run:
        dir: ${store_dir}/${project}_logs/${now:%Y-%m-%d_%H-%M-%S}
