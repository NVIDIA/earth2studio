# Reference tracks of the WeatherNext 2 cases: IBTrACS, and TempestExtremes on
# the IFS analysis the forecasts start from.
project: 'reference_tracks_ifs'
mode: 'extract_baseline'

cases:
    melissa:
        year: 2025
        basin: north_atlantic

    ragasa:
        year: 2025
        basin: west_pacific

# IBTrACS CSV (auto-downloaded from NCEI on first use if missing)
ibtracs_source_data: "./aux_data/ibtracs.ALL.list.v04r01.csv"

data_source:
    _target_: earth2studio.data.IFS
    # the open data bucket throttles requests: allow for retries
    async_timeout: 3600

store_dir: "./outputs_${project}"

num_workers: 2
max_dist: 300000

cyclone_tracking:
    vars: ['msl', 'u10m', 'v10m', 'z300', 'z500']
    detect_cmd: >-
      DetectNodes --verbosity 0 --mergedist 6
      --closedcontourcmd
      _DIFF(z300,z500),-58.8,6.5,0.;msl,200.,5.5,0
      --searchbymin msl --outputcmd
      msl,min,0;_VECMAG(u10m,v10m),max,5;height,min,0
    stitch_cmd: >-
      StitchNodes
      --in_fmt lon,lat,msl,wind_speed,height
      --range 8.0 --mintime 54h --maxgap 4
      --out_file_format csv --threshold
      wind_speed,>=,10.,10;lat,<=,50.,10;lat,>=,-50.,10;height,<=,150.,10
    orography_path: https://huggingface.co/nvidia/fourcastnet3/blob/main/orography.nc
    keep_raw_data: False
    scratch_dir: null
    print_te_output: False

# hydra logs
hydra:
    job:
        name: ${project}
    run:
        dir: ${store_dir}/${project}_logs/${now:%Y-%m-%d_%H-%M-%S}
