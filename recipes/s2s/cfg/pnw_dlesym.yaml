defaults:
    - forecast_model: dlesym
    - perturbation: none

project: 'pnw_heatwave'
random_seed: 42
run_id: 'dlesym_v11_64m' # unique identifier for the ensemble run

# Set initial condition to early June 2021
start_times: ["2021-06-10 00:00:00"]
nsteps: 12         # number of steps to run the forecast
nperturbed: 64     # Ensemble members per model checkpoint (DLESyM v1.1 samples them)
                    # Total ensemble size is nperturbed * ncheckpoints
ncheckpoints: 1  # DLESyM v1.1 ships a single stochastic checkpoint

batch_size: 8      # inference batch size
output_path: "outputs"

data_source:
    _target_: earth2studio.data.ARCO_ERA5 # Using ERA5 data source
    verbose: False

file_output:
    path: '${output_path}/${project}_${run_id}'  # directory to which outfiles are written
    output_vars: ['t2m', 'z500']  # Variables to be saved
    resume: False         # skip batches finished by an earlier run (needs random_seed)
    overwrite_store: True # Whether or not to overwrite an existing output file
    format:               # io backend class
        _target_: earth2studio.io.AsyncZarrBackend
        _partial_: True
        blocking: False   # write on background threads, overlapping inference
        pool_size: 8      # writer threads

    # North America region cropbox
    cropboxes:
        north_america:
            lat_min: 20
            lat_max: 70
            lon_min: 210
            lon_max: 260

hydra:
    run:
        dir: '${output_path}/${project}_${run_id}'
