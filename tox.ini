[tox]
requires =
    tox >= 4.0
    tox-uv >= 1.28.0
envlist =
    test
    test-data
    test-perturb
    test-stats
    test-px-models
    test-dx-models
    test-da-models
    test-px-models-ace2

[testenv]
# Base configuration for all environments
# This installs the local package in editable mode
# plus any extras or groups defined below.
package = editable
basepython = python3.13
passenv =
    EARTH2STUDIO_CACHE
    EARTH2STUDIO_DATA_CACHE
    EARTH2STUDIO_MODEL_CACHE
    EARTH2STUDIO_PACKAGE_TIMEOUT
    TESTMON_DATAFILE
    UV_CACHE_DIR
    S3FS_ENDPOINT
    S3FS_KEY
    S3FS_SECRET
    HF_TOKEN
    CDSAPI_KEY
    CDSAPI_URL
    EUMETSAT_CONSUMER_KEY
    EUMETSAT_CONSUMER_SECRET
    EARTHMOVER_API_KEY
    EARTHMOVER_ORGANIZATION
    MAX_JOBS
    GITHUB_ACTIONS
    DATA_TEST_*
setenv =
    # https://docs.jax.dev/en/latest/gpu_memory_allocation.html
    XLA_PYTHON_CLIENT_ALLOCATOR = vmm
    XLA_PYTHON_CLIENT_PREALLOCATE = false
    # Fixed RNG keys alone do not make GPU graph reductions reproducible.
    XLA_FLAGS = {env:XLA_FLAGS:} --xla_gpu_exclude_nondeterministic_ops=true
    # Performance optimization for Atlas model
    TORCH_ALLOW_TF32_CUBLAS_OVERRIDE = 1
    # Unique coverage file per tox env so parallel CI jobs don't overwrite each other
    COVERAGE_FILE = .coverage.{envname}

[testenv:test]
runner = uv-venv-lock-runner
description = Run tests that need no extra dependencies
commands =
    pytest --junitxml={toxinidir}/.cache/test-results/{envname}/junit.xml {posargs:-s --cov --cov-append --slow --testmon} \
        test/io \
        test/run \
        test/utils/test_coords.py \
        test/utils/test_imports.py \
        test/models/test_auto_models.py \
        test/models/test_batch.py \
        test/models/test_conformance.py \
        test/models/test_model_conformance.py

[testenv:test-data]
runner = uv-venv-lock-runner
description = Run lexicon tests and supervised data-source tests
extras = data,cbottle
commands =
    pytest --junitxml={toxinidir}/.cache/test-results/{envname}/runner.xml --noconftest -c /dev/null test/_ci/test_data_runner.py
    pytest --junitxml={toxinidir}/.cache/test-results/{envname}/lexicon.xml {posargs:--cov --cov-append --slow --package --testmon} test/lexicon
    python test/_ci/run_data_tests.py -- {posargs:--cov --cov-append --slow --package --testmon}

[testenv:test-perturb]
runner = uv-venv-lock-runner
description = Run tests for perturbation methods
extras = perturbation
commands =
    pytest --junitxml={toxinidir}/.cache/test-results/{envname}/junit.xml {posargs:-s --cov --cov-append --slow --testmon} \
        test/perturbation

[testenv:test-stats]
runner = uv-venv-lock-runner
description = Run tests for statistical methods, grids, interpolation and coupling
extras = statistics,utils
commands =
    pytest --junitxml={toxinidir}/.cache/test-results/{envname}/junit.xml {posargs:-s --cov --cov-append --slow --testmon} \
        test/statistics \
        test/grids \
        test/utils/test_interp.py \
        test/coupling

# =====================
# TODO: NGeneva figure out how to add packages back
# =====================
[testenv:test-px-models]
runner = uv-venv-lock-runner
description = Run tests for px models using all env
extras = all
commands =
    pytest --junitxml={toxinidir}/.cache/test-results/{envname}/junit.xml {posargs:-s --cov --cov-append --slow --testmon} \
        test/models/px

[testenv:test-dx-models]
runner = uv-venv-lock-runner
description = Run tests for dx models using all env
extras = all
commands =
    pytest --junitxml={toxinidir}/.cache/test-results/{envname}/junit.xml {posargs:-s --cov --cov-append --slow --package --testmon} \
        test/models/dx

[testenv:test-da-models]
runner = uv-venv-lock-runner
description = Run tests for da models using all env
extras = all
commands =
    pytest --junitxml={toxinidir}/.cache/test-results/{envname}/junit.xml {posargs:-s --cov --cov-append --slow --package --testmon} \
        test/models/da

# =====================
# Conflict environments
# =====================
[testenv:test-px-models-conflicts]
runner = uv-venv-lock-runner
description = Run tests for px models with conflicts
commands =
    uv sync --extra ace2
    pytest --junitxml={toxinidir}/.cache/test-results/{envname}/ace2.xml {posargs:-s --cov --cov-append --slow --package --testmon} \
        test/models/px/test_ace2.py

    uv sync --extra aifs
    pytest --junitxml={toxinidir}/.cache/test-results/{envname}/aifs.xml {posargs:-s --cov --cov-append --slow --package --testmon} \
        test/models/px/test_aifs.py

	uv sync --extra aifs2
    pytest --junitxml={toxinidir}/.cache/test-results/{envname}/aifs2.xml {posargs:-s --cov --cov-append --slow --package --testmon} \
        test/models/px/test_aifs2.py

	uv sync --extra aifsens
    pytest --junitxml={toxinidir}/.cache/test-results/{envname}/aifsens.xml {posargs:-s --cov --cov-append --slow --package --testmon} \
        test/models/px/test_aifsens.py

	uv sync --extra aifs2ens
    pytest --junitxml={toxinidir}/.cache/test-results/{envname}/aifs2ens.xml {posargs:-s --cov --cov-append --slow --package --testmon} \
        test/models/px/test_aifs2ens.py

    uv sync --extra stormcast-conus
    pytest --junitxml={toxinidir}/.cache/test-results/{envname}/stormcastconus.xml {posargs:-s --cov --cov-append --slow --package --testmon} \
        test/models/px/test_stormcastconus.py
