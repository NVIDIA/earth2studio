name: Run CI test job
description: Restore shared testmon state and run one tox-backed test job.

inputs:
  tox-env:
    description: Tox environment to run.
    required: true
  save-testmon-cache:
    description: Whether to save the testmon cache after the test run.
    default: "false"
  testmon-base-branch:
    description: Branch whose testmon database is the test baseline.
    default: main

runs:
  using: composite
  steps:
    - name: Verify test container Torch version
      shell: bash
      run: test/_ci/check_torch_version.sh

    - name: Configure git safe directory
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Prepare runner temp model cache
      shell: bash
      run: mkdir -p "${RUNNER_TEMP}/earth2studio-models"

    - name: Restore testmon cache
      id: testmon-cache
      if: inputs.save-testmon-cache == 'true' || inputs.testmon-base-branch == 'main'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      continue-on-error: true
      with:
        path: ${{ env.TESTMON_CACHE }}
        key: e2s-testmon-${{ inputs.tox-env }}-${{ runner.os }}-${{ inputs.testmon-base-branch }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          e2s-testmon-${{ inputs.tox-env }}-${{ runner.os }}-${{ inputs.testmon-base-branch }}-

    # Push events on copied PR branches cannot restore another branch's cache.
    - name: Find RC testmon baseline
      id: baseline
      if: inputs.save-testmon-cache != 'true' && inputs.testmon-base-branch != 'main'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      continue-on-error: true
      env:
        TESTMON_BASE_BRANCH: ${{ inputs.testmon-base-branch }}
        TESTMON_TOX_ENV: ${{ inputs.tox-env }}
      with:
        script: |
          const branch = process.env.TESTMON_BASE_BRANCH;
          const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
            ...context.repo,
            name: `testmon-${branch}-${process.env.TESTMON_TOX_ENV}`,
            per_page: 100,
          });
          // Newest first; exclude expired databases and runs on other branches.
          const artifact = artifacts.find(item =>
            !item.expired && item.workflow_run?.head_branch === branch
          );
          const runId = artifact ? String(artifact.workflow_run.id) : '';
          core.setOutput('run-id', runId);
          if (!runId) core.notice('No testmon baseline found; running without cached test selection.');

    - name: Download RC testmon baseline
      if: steps.baseline.outputs.run-id != ''
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      continue-on-error: true
      with:
        name: testmon-${{ inputs.testmon-base-branch }}-${{ inputs.tox-env }}
        path: ${{ env.TESTMON_CACHE }}
        github-token: ${{ github.token }}
        run-id: ${{ steps.baseline.outputs.run-id }}

    - name: Prepare CI directories
      shell: bash
      env:
        EARTH2STUDIO_MODEL_CACHE: ${{ runner.temp }}/earth2studio-models
      run: python3 test/_ci/prepare_ci_paths.py

    - name: Show GPU information
      shell: bash
      run: nvidia-smi

    - name: Set up environment
      shell: bash
      run: uv sync --python 3.13.13

    - name: Run tests
      shell: bash
      env:
        TOX_ENV: ${{ inputs.tox-env }}
        EARTH2STUDIO_MODEL_CACHE: ${{ runner.temp }}/earth2studio-models
      run: make pytest-ci

    - name: Upload coverage data
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-${{ inputs.tox-env }}
        path: .coverage.*
        include-hidden-files: true
        if-no-files-found: ignore

    - name: Save testmon cache
      if: >
        success() &&
        inputs.save-testmon-cache == 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      continue-on-error: true
      with:
        path: ${{ env.TESTMON_CACHE }}
        key: e2s-testmon-${{ inputs.tox-env }}-${{ runner.os }}-${{ inputs.testmon-base-branch }}-${{ github.run_id }}-${{ github.run_attempt }}

    # The first RC run seeds these databases with a full test run.
    # Later RC pushes refresh them for copied PRs targeting that branch.
    - name: Publish RC testmon baseline
      if: success() && inputs.save-testmon-cache == 'true' && inputs.testmon-base-branch != 'main'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      continue-on-error: true
      with:
        name: testmon-${{ inputs.testmon-base-branch }}-${{ inputs.tox-env }}
        path: ${{ env.TESTMON_CACHE }}
        include-hidden-files: true
        if-no-files-found: ignore
        overwrite: true
        retention-days: 30
