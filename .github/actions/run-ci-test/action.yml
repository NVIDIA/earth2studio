name: Run CI test job
description: Restore shared Earth2Studio test caches and run one tox-backed test job.

inputs:
  tox-env:
    description: Tox environment to run.
    required: true

runs:
  using: composite
  steps:
    - name: Configure git safe directory
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Restore uv cache
      uses: actions/cache/restore@v5
      continue-on-error: true
      with:
        path: ${{ env.UV_CACHE_DIR }}
        key: e2s-uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          e2s-uv-${{ runner.os }}-

    - name: Restore model cache
      id: model-cache
      uses: actions/cache/restore@v5
      continue-on-error: true
      with:
        path: ${{ env.EARTH2STUDIO_MODEL_CACHE }}
        key: e2s-model-${{ runner.os }}-main
        restore-keys: |
          e2s-model-${{ runner.os }}-

    - name: Restore testmon cache
      id: testmon-cache
      uses: actions/cache/restore@v5
      continue-on-error: true
      with:
        path: ${{ env.TESTMON_CACHE }}
        key: e2s-testmon-${{ inputs.tox-env }}-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          e2s-testmon-${{ inputs.tox-env }}-${{ runner.os }}-main-

    - name: Prepare CI directories
      shell: bash
      run: python3 test/_ci/prepare_ci_paths.py

    - name: Show GPU information
      shell: bash
      run: nvidia-smi

    - name: Set up environment
      shell: bash
      run: uv sync

    - name: Run tests
      shell: bash
      env:
        TOX_ENV: ${{ inputs.tox-env }}
      run: make pytest-ci

    - name: Upload coverage data
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ inputs.tox-env }}
        path: .coverage.*
        include-hidden-files: true
        if-no-files-found: ignore

    - name: Save model cache
      if: >
        always() &&
        (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
        steps.model-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      continue-on-error: true
      with:
        path: ${{ env.EARTH2STUDIO_MODEL_CACHE }}
        key: e2s-model-${{ runner.os }}-main

    - name: Save testmon cache
      if: >
        always() &&
        github.ref == 'refs/heads/main'
      uses: actions/cache/save@v5
      continue-on-error: true
      with:
        path: ${{ env.TESTMON_CACHE }}
        key: e2s-testmon-${{ inputs.tox-env }}-${{ runner.os }}-main-${{ github.run_id }}-${{ github.run_attempt }}
