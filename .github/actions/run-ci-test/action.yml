name: Run CI test job
description: Restore shared testmon state and run one tox-backed test job.

inputs:
  tox-env:
    description: Tox environment to run.
    required: true
  save-testmon-cache:
    description: Whether to save the testmon cache after the test run.
    default: "false"

runs:
  using: composite
  steps:
    - name: Configure git safe directory
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Restore testmon cache
      id: testmon-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      continue-on-error: true
      with:
        path: ${{ env.TESTMON_CACHE }}
        key: e2s-testmon-${{ inputs.tox-env }}-${{ runner.os }}-main-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          e2s-testmon-${{ inputs.tox-env }}-${{ runner.os }}-main-

    - name: Prepare CI directories
      shell: bash
      run: python3 test/_ci/prepare_ci_paths.py

    - name: Show GPU information
      shell: bash
      run: nvidia-smi

    - name: Set up environment
      shell: bash
      run: uv sync --python 3.13.13

    - name: Run tests
      shell: bash
      env:
        TOX_ENV: ${{ inputs.tox-env }}
      run: make pytest-ci

    - name: Upload coverage data
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-${{ inputs.tox-env }}
        path: .coverage.*
        include-hidden-files: true
        if-no-files-found: ignore

    - name: Save testmon cache
      if: >
        always() &&
        inputs.save-testmon-cache == 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      continue-on-error: true
      with:
        path: ${{ env.TESTMON_CACHE }}
        key: e2s-testmon-${{ inputs.tox-env }}-${{ runner.os }}-main-${{ github.run_id }}-${{ github.run_attempt }}
