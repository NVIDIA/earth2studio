name: e2s-docs-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: read

defaults:
  run:
    shell: bash

concurrency:
  group: e2s-docs-api-gh-pages
  cancel-in-progress: false

env:
  E2S_CI_IMAGE: &e2s_ci_image ghcr.io/nvidia/earth2studio-ci:0.2
  CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
  CDSAPI_URL: https://cds.climate.copernicus.eu/api
  DOC_PUBLIC_BUILD: "false"
  EARTH2STUDIO_CACHE: ${{ github.workspace }}/.cache/earth2studio
  EARTH2STUDIO_DATA_CACHE: ${{ github.workspace }}/.cache/earth2studio-data
  EARTH2STUDIO_MODEL_CACHE: ${{ github.workspace }}/.cache/earth2studio-models
  EARTHMOVER_API_KEY: ${{ secrets.EARTHMOVER_API_KEY }}
  EARTHMOVER_ORGANIZATION: ${{ secrets.EARTHMOVER_ORGANIZATION }}
  EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
  EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  TORCH_ALLOW_TF32_CUBLAS_OVERRIDE: "1"
  UV_PYTHON: "3.13.13"

jobs:
  build-docs:
    name: Build API docs
    if: github.repository == 'NVIDIA/earth2studio'
    runs-on: linux-amd64-cpu8
    timeout-minutes: 60
    container:
      image: *e2s_ci_image
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Prepare CI directories
        run: python3 test/_ci/prepare_ci_paths.py

      - name: Check uv lockfile
        run: uv lock --check

      - name: Build API docs
        run: make docs

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-api-html
          path: docs/_build/html/
          if-no-files-found: error
          retention-days: 1

  publish-docs:
    name: Publish API docs
    if: github.repository == 'NVIDIA/earth2studio'
    needs: build-docs
    runs-on: linux-amd64-cpu8
    container:
      image: *e2s_ci_image
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GH_PAGES_FOLDER: ${{ runner.temp }}/gh-pages
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-api-html
          path: docs/_build/html

      - name: Publish to gh-pages
        run: |
          set -euo pipefail

          git config --global user.email "ngeneva@nvidia.com"
          git config --global user.name "Nicholas Geneva"

          rm -rf "$GH_PAGES_FOLDER"
          git clone \
            --single-branch \
            --depth 1 \
            --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$GH_PAGES_FOLDER"

          rsync -a docs/_build/html/index.html "$GH_PAGES_FOLDER/"
          rsync -a docs/_build/html/genindex.html "$GH_PAGES_FOLDER/"
          rsync -a docs/_build/html/search.html "$GH_PAGES_FOLDER/"
          rsync -a docs/_build/html/modules "$GH_PAGES_FOLDER/"
          rsync -a docs/_build/html/_sources "$GH_PAGES_FOLDER/"
          rsync -a docs/_build/html/userguide "$GH_PAGES_FOLDER/"
          rsync -a docs/_build/html/_static "$GH_PAGES_FOLDER/"

          git_sha_short=$(git rev-parse --short HEAD)
          cd "$GH_PAGES_FOLDER"
          git add --all

          if git diff --cached --quiet; then
            echo "No docs changes to publish."
            exit 0
          fi

          git commit -m "[CI] API Docs Build ${git_sha_short}"
          git push origin gh-pages
