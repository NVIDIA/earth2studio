name: e2s-docs-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

concurrency:
  group: e2s-docs-pages
  cancel-in-progress: false

env:
  E2S_CI_IMAGE: &e2s_ci_image ghcr.io/nvidia/earth2studio-ci:0.2
  CDSAPI_URL: https://cds.climate.copernicus.eu/api
  DOC_PUBLIC_BUILD: "false"
  DOCS_PAGES_STATE: ${{ github.workspace }}/.cache/docs-pages-state
  EARTH2STUDIO_CACHE: ${{ github.workspace }}/.cache/earth2studio
  EARTH2STUDIO_DATA_CACHE: ${{ github.workspace }}/.cache/earth2studio-data
  EARTH2STUDIO_MODEL_CACHE: ${{ github.workspace }}/.cache/earth2studio-models
  TORCH_ALLOW_TF32_CUBLAS_OVERRIDE: "1"
  UV_PYTHON: "3.13.13"

jobs:
  build-docs:
    name: Build API docs
    if: github.repository == 'NVIDIA/earth2studio' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: linux-amd64-cpu8
    timeout-minutes: 60
    container:
      image: *e2s_ci_image
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate docs publication ref
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Ref '${GITHUB_REF_NAME}' is not a trusted API docs publication ref." >&2
            exit 1
          fi

          echo "API docs publication ref: ${GITHUB_REF_NAME}"

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Prepare CI directories
        run: python3 test/_ci/prepare_ci_paths.py

      - name: Check uv lockfile
        run: uv lock --check

      - name: Build API docs
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          EARTHMOVER_API_KEY: ${{ secrets.EARTHMOVER_API_KEY }}
          EARTHMOVER_ORGANIZATION: ${{ secrets.EARTHMOVER_ORGANIZATION }}
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make docs

      - name: Upload docs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-api-html
          path: docs/_build/html/
          if-no-files-found: error
          retention-days: 1

  publish-docs:
    name: Publish API docs
    if: github.repository == 'NVIDIA/earth2studio' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      id-token: write
      packages: read
      pages: write
    needs: build-docs
    runs-on: linux-amd64-cpu8
    environment:
      name: docs-publish
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore published docs state
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: true
        with:
          path: ${{ env.DOCS_PAGES_STATE }}
          key: e2s-docs-pages-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            e2s-docs-pages-state-

      - name: Download docs artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-api-html
          path: docs/_build/html

      - name: Prepare GitHub Pages site
        env:
          DOCS_BUILD_DIR: docs/_build/html
          DOC_VERSION: main
          DOC_TITLE: main
          PUBLISH_PATH: .
        run: python3 test/_ci/prepare_docs_pages.py

      - name: Upload assembled docs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-api-pages-site
          path: ${{ env.DOCS_PAGES_STATE }}
          if-no-files-found: error
          retention-days: 10

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ env.DOCS_PAGES_STATE }}

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Save published docs state
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: true
        with:
          path: ${{ env.DOCS_PAGES_STATE }}
          key: e2s-docs-pages-state-${{ github.run_id }}-${{ github.run_attempt }}
