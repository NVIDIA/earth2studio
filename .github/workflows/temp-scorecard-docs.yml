# TEMPORARY workflow — publishes the docs (with the scorecard pages) to this
# fork's GitHub Pages so the results can be viewed without a cluster login.
# Remove this file before opening a PR against upstream.
#
# One-time setup on the fork: Settings -> Pages -> Source: "GitHub Actions".
# The site lands at https://<owner>.github.io/earth2studio/scorecard/

name: temp-scorecard-docs

on:
  push:
    branches: [eval]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Guard: never deploy from the upstream repo if this file ever lands there.
    if: github.repository == 'Dibyajyoti-Chakraborty/earth2studio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Fast docs build: gallery examples are not executed
      # (E2S_GALLERY_EXECUTE=never in the make target), so no GPU is needed.
      - run: make docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.repository == 'Dibyajyoti-Chakraborty/earth2studio'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
