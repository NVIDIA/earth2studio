name: e2s-ci-test-main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

env:
  CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
  CDSAPI_URL: https://cds.climate.copernicus.eu/api
  EARTH2STUDIO_MODEL_CACHE: ${{ github.workspace }}/.cache/earth2studio-models
  EARTHMOVER_API_KEY: ${{ secrets.EARTHMOVER_API_KEY }}
  EARTHMOVER_ORGANIZATION: ${{ secrets.EARTHMOVER_ORGANIZATION }}
  EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
  EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PRE_COMMIT_HOME: ${{ github.workspace }}/.cache/pre-commit
  TESTMON_CACHE: ${{ github.workspace }}/.cache/testmon
  TESTMON_DATAFILE: ${{ github.workspace }}/.cache/testmon/.testmondata
  TORCH_ALLOW_TF32_CUBLAS_OVERRIDE: "1"
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv

jobs:
  setup-env:
    name: Set up environment
    if: github.repository == 'NVIDIA/earth2studio'
    runs-on: linux-amd64-gpu-h100-latest-1
    timeout-minutes: 120
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.1
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      FLASH_ATTN_CUDA_ARCHS: "90"
      MAX_JOBS: "8"
      NATTEN_CUDA_ARCH: "9.0"
      NATTEN_N_WORKERS: "8"
      NVCC_THREADS: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore uv cache
        id: uv-cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: e2s-uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            e2s-uv-${{ runner.os }}-

      - name: Restore pre-commit cache
        id: pre-commit-cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: e2s-pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            e2s-pre-commit-${{ runner.os }}-

      - name: Prepare CI directories
        run: python3 test/_ci/prepare_ci_paths.py

      - name: Check uv lockfile
        run: uv lock --check

      - name: Set up CI environment
        run: make setup-ci

      - name: Save uv cache
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: e2s-uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Save pre-commit cache
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: e2s-pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

  test:
    name: Test
    if: github.repository == 'NVIDIA/earth2studio'
    needs: setup-env
    runs-on: linux-amd64-gpu-h100-latest-1
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.1
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run test job
        uses: ./.github/actions/run-ci-test
        with:
          tox-env: test
          save-model-cache: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          save-testmon-cache: ${{ github.ref == 'refs/heads/main' }}

  test-px-models:
    name: Test prognostic models
    if: github.repository == 'NVIDIA/earth2studio'
    needs: setup-env
    runs-on: linux-amd64-gpu-h100-latest-1
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.1
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run test job
        uses: ./.github/actions/run-ci-test
        with:
          tox-env: test-px-models
          save-model-cache: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          save-testmon-cache: ${{ github.ref == 'refs/heads/main' }}

  test-dx-models:
    name: Test diagnostic models
    if: github.repository == 'NVIDIA/earth2studio'
    needs: setup-env
    runs-on: linux-amd64-gpu-h100-latest-1
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.1
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run test job
        uses: ./.github/actions/run-ci-test
        with:
          tox-env: test-dx-models
          save-model-cache: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          save-testmon-cache: ${{ github.ref == 'refs/heads/main' }}

  test-data:
    name: Test data sources
    if: github.repository == 'NVIDIA/earth2studio'
    needs: setup-env
    runs-on: linux-amd64-gpu-h100-latest-1
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.1
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run test job
        uses: ./.github/actions/run-ci-test
        with:
          tox-env: test-data
          save-model-cache: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          save-testmon-cache: ${{ github.ref == 'refs/heads/main' }}

  test-perturb:
    name: Test perturbation methods
    if: github.repository == 'NVIDIA/earth2studio'
    needs: setup-env
    runs-on: linux-amd64-gpu-h100-latest-1
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.1
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run test job
        uses: ./.github/actions/run-ci-test
        with:
          tox-env: test-perturb
          save-model-cache: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          save-testmon-cache: ${{ github.ref == 'refs/heads/main' }}

  test-stats:
    name: Test statistics and metrics
    if: github.repository == 'NVIDIA/earth2studio'
    needs: setup-env
    runs-on: linux-amd64-gpu-h100-latest-1
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.1
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run test job
        uses: ./.github/actions/run-ci-test
        with:
          tox-env: test-stats
          save-model-cache: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          save-testmon-cache: ${{ github.ref == 'refs/heads/main' }}

  test-da-models:
    name: Test data assimilation models
    if: github.repository == 'NVIDIA/earth2studio'
    needs: setup-env
    runs-on: linux-amd64-gpu-h100-latest-1
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.1
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run test job
        uses: ./.github/actions/run-ci-test
        with:
          tox-env: test-da-models
          save-model-cache: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          save-testmon-cache: ${{ github.ref == 'refs/heads/main' }}

  test-px-models-conflicts:
    name: Test model conflict environments
    if: github.repository == 'NVIDIA/earth2studio'
    needs: setup-env
    runs-on: linux-amd64-gpu-h100-latest-1
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.1
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run test job
        uses: ./.github/actions/run-ci-test
        with:
          tox-env: test-px-models-conflicts
          save-model-cache: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          save-testmon-cache: ${{ github.ref == 'refs/heads/main' }}

  test-serve:
    name: Test serve
    if: github.repository == 'NVIDIA/earth2studio'
    needs: setup-env
    runs-on: linux-amd64-gpu-h100-latest-1
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.1
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run test job
        uses: ./.github/actions/run-ci-test
        with:
          tox-env: test-serve
          save-model-cache: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          save-testmon-cache: ${{ github.ref == 'refs/heads/main' }}

  coverage:
    name: Coverage
    if: github.repository == 'NVIDIA/earth2studio' && always()
    needs:
      - test
      - test-px-models
      - test-dx-models
      - test-data
      - test-perturb
      - test-stats
      - test-da-models
      - test-px-models-conflicts
      - test-serve
    runs-on: linux-amd64-cpu8
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore uv cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: e2s-uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            e2s-uv-${{ runner.os }}-

      - name: Set up environment
        run: uv sync

      - name: Download coverage data
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Generate coverage report
        run: |
          if ! compgen -G ".coverage.*" > /dev/null; then
            echo "No coverage data artifacts found." | tee coverage-report.txt
            exit 0
          fi

          make coverage | tee coverage-report.txt

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage-report.txt
            .coverage
          include-hidden-files: true
          if-no-files-found: ignore
