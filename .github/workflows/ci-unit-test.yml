name: ci-unit-test

on:
  push:
    branches:
      - main
      - "pull-request/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

env:
  EARTH2STUDIO_MODEL_CACHE: ${{ github.workspace }}/.cache/earth2studio-models
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  TESTMON_CACHE: ${{ github.workspace }}/.cache/testmon
  TESTMON_DATAFILE: ${{ github.workspace }}/.cache/testmon/.testmondata
  TORCH_ALLOW_TF32_CUBLAS_OVERRIDE: "1"
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      test_matrix: ${{ steps.filter.outputs.test_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select test jobs
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            : > changed-files.txt
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="HEAD^"
            fi
            git diff --name-only "$base" "$GITHUB_SHA" > changed-files.txt
          else
            git fetch origin main
            git diff --name-only origin/main...HEAD > changed-files.txt
          fi

          cat changed-files.txt
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          files = Path("changed-files.txt").read_text().splitlines()
          run_all = os.environ["EVENT_NAME"] == "workflow_dispatch"
          matrix = [{"tox_env": "test", "name": "Test", "cache": "test"}]

          def changed(patterns: tuple[str, ...]) -> bool:
              return run_all or any(
                  re.search(pattern, filename)
                  for filename in files
                  for pattern in patterns
              )

          test_buckets = (
              (
                  "test-data",
                  "Test data sources",
                  "test-data",
                  (
                      r"^(earth2studio/data/|earth2studio/lexicon/)",
                      r"^(test/data/|test/lexicon/)",
                  ),
              ),
              (
                  "test-perturb",
                  "Test perturbation methods",
                  "test-perturb",
                  (r"^(earth2studio/perturbation/|test/perturbation/)",),
              ),
              (
                  "test-stats",
                  "Test statistics and metrics",
                  "test-stats",
                  (
                      r"^(earth2studio/statistics/|test/statistics/)",
                      r"^(earth2studio/metrics/|test/metrics/)",
                      r"^(earth2studio/utils/interp.py|test/utils/test_interp.py)$",
                  ),
              ),
              (
                  "test-px-models",
                  "Test prognostic models",
                  "test-px-models",
                  (r"^(earth2studio/models/px/|test/models/px/)",),
              ),
              (
                  "test-dx-models",
                  "Test diagnostic models",
                  "test-dx-models",
                  (r"^(earth2studio/models/dx/|test/models/dx/)",),
              ),
              (
                  "test-da-models",
                  "Test data assimilation models",
                  "test-da-models",
                  (r"^(earth2studio/models/da/|test/models/da/)",),
              ),
              (
                  "test-px-models-conflicts",
                  "Test model conflict environments",
                  "test-px-models-conflicts",
                  (r"^(earth2studio/models/px/|test/models/px/)",),
              ),
              (
                  "test-serve",
                  "Test serve",
                  "test-serve",
                  (r"^(earth2studio/serve/|test/serve/|serve/)",),
              ),
          )

          for tox_env, name, cache, patterns in test_buckets:
              if changed(patterns):
                  matrix.append({"tox_env": tox_env, "name": name, "cache": cache})

          print("Selected test jobs:")
          for job in matrix:
              print(f"- {job['tox_env']}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("test_matrix<<EOF\n")
              output.write(json.dumps({"include": matrix}, separators=(",", ":")))
              output.write("\nEOF\n")
          PY

  setup-env:
    name: Set up environment
    runs-on: linux-amd64-cpu8
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore uv cache
        id: uv-cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: e2s-uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            e2s-uv-${{ runner.os }}-

      - name: Check uv lockfile
        run: uv lock --check

      - name: Set up environment
        run: uv sync

      - name: Save uv cache
        if: >
          (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
          steps.uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: e2s-uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

  format:
    name: Format
    needs: setup-env
    runs-on: linux-amd64-cpu8
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore uv cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: e2s-uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            e2s-uv-${{ runner.os }}-

      - name: Set up environment
        run: uv sync

      - name: Check formatting
        run: make format

  lint:
    name: Lint
    needs: format
    runs-on: linux-amd64-cpu8
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore uv cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: e2s-uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            e2s-uv-${{ runner.os }}-

      - name: Set up environment
        run: uv sync

      - name: Check docstring coverage
        run: make interrogate

      - name: Run lint checks
        run: make lint

      - name: Check license headers
        run: make license

  test:
    name: ${{ matrix.name }}
    needs:
      - lint
      - changes
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.test_matrix) }}
    runs-on: linux-amd64-gpu-h100-latest-1
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.1
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      TOX_ENV: ${{ matrix.tox_env }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore uv cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: e2s-uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            e2s-uv-${{ runner.os }}-

      - name: Restore model cache
        id: model-cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ env.EARTH2STUDIO_MODEL_CACHE }}
          key: e2s-model-${{ runner.os }}-main
          restore-keys: |
            e2s-model-${{ runner.os }}-

      - name: Restore testmon cache
        id: testmon-cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ env.TESTMON_CACHE }}
          key: e2s-testmon-${{ matrix.cache }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            e2s-testmon-${{ matrix.cache }}-${{ runner.os }}-main-

      - name: Prepare CI directories
        run: python3 test/_ci/prepare_ci_paths.py

      - name: Show GPU information
        run: nvidia-smi

      - name: Set up environment
        run: uv sync

      - name: Run tests
        run: make pytest-ci

      - name: Save model cache
        if: >
          always() &&
          (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
          steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ env.EARTH2STUDIO_MODEL_CACHE }}
          key: e2s-model-${{ runner.os }}-main

      - name: Save testmon cache
        if: >
          always() &&
          github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ env.TESTMON_CACHE }}
          key: e2s-testmon-${{ matrix.cache }}-${{ runner.os }}-main-${{ github.run_id }}-${{ github.run_attempt }}
