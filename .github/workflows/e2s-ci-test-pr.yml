name: e2s-ci-test-pr

on:
  push:
    branches:
      - "pull-request/**"

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

env:
  CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
  CDSAPI_URL: https://cds.climate.copernicus.eu/api
  EARTH2STUDIO_MODEL_CACHE: ${{ github.workspace }}/.cache/earth2studio-models
  EARTHMOVER_API_KEY: ${{ secrets.EARTHMOVER_API_KEY }}
  EARTHMOVER_ORGANIZATION: ${{ secrets.EARTHMOVER_ORGANIZATION }}
  EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
  EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PRE_COMMIT_HOME: ${{ github.workspace }}/.cache/pre-commit
  TESTMON_CACHE: ${{ github.workspace }}/.cache/testmon
  TESTMON_DATAFILE: ${{ github.workspace }}/.cache/testmon/.testmondata
  TORCH_ALLOW_TF32_CUBLAS_OVERRIDE: "1"

jobs:
  changes:
    name: Detect changes
    if: github.repository == 'NVIDIA/earth2studio'
    runs-on: ubuntu-latest
    outputs:
      data: ${{ steps.filter.outputs.data }}
      perturb: ${{ steps.filter.outputs.perturb }}
      stats: ${{ steps.filter.outputs.stats }}
      px_models: ${{ steps.filter.outputs.px_models }}
      dx_models: ${{ steps.filter.outputs.dx_models }}
      da_models: ${{ steps.filter.outputs.da_models }}
      serve: ${{ steps.filter.outputs.serve }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed test suites
        id: filter
        uses: ./.github/actions/detect-ci-changes
        with:
          mode: pr

  setup-env:
    name: Set up environment
    if: github.repository == 'NVIDIA/earth2studio'
    runs-on: linux-amd64-gpu-h100-latest-1
    timeout-minutes: 120
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.2
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      FLASH_ATTN_CUDA_ARCHS: "90"
      MAX_JOBS: "8"
      NATTEN_CUDA_ARCH: "9.0"
      NATTEN_N_WORKERS: "8"
      NVCC_THREADS: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore pre-commit cache
        id: pre-commit-cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: e2s-pre-commit-${{ runner.os }}-main-${{ hashFiles('.pre-commit-config.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            e2s-pre-commit-${{ runner.os }}-main-${{ hashFiles('.pre-commit-config.yaml') }}-
            e2s-pre-commit-${{ runner.os }}-main-

      - name: Prepare CI directories
        run: python3 test/_ci/prepare_ci_paths.py

      - name: Check uv lockfile
        run: uv lock --check

      - name: Set up CI environment
        run: make setup-ci

  format:
    name: Format
    if: github.repository == 'NVIDIA/earth2studio'
    needs: setup-env
    runs-on: linux-amd64-cpu8
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.2-lint
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore pre-commit cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: e2s-pre-commit-${{ runner.os }}-main-${{ hashFiles('.pre-commit-config.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            e2s-pre-commit-${{ runner.os }}-main-${{ hashFiles('.pre-commit-config.yaml') }}-
            e2s-pre-commit-${{ runner.os }}-main-

      - name: Set up environment
        run: uv sync --only-dev --no-install-project

      - name: Check formatting
        env:
          UV_NO_SYNC: "1"
        run: make format

  lint:
    name: Lint
    if: github.repository == 'NVIDIA/earth2studio'
    needs: format
    runs-on: linux-amd64-cpu8
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.2-lint
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore pre-commit cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: e2s-pre-commit-${{ runner.os }}-main-${{ hashFiles('.pre-commit-config.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            e2s-pre-commit-${{ runner.os }}-main-${{ hashFiles('.pre-commit-config.yaml') }}-
            e2s-pre-commit-${{ runner.os }}-main-

      - name: Set up environment
        run: uv sync --only-dev --no-install-project

      - name: Check docstring coverage
        env:
          UV_NO_SYNC: "1"
        run: make interrogate

      - name: Run lint checks
        env:
          UV_NO_SYNC: "1"
        run: make lint

      - name: Check license headers
        env:
          UV_NO_SYNC: "1"
        run: make license

  test:
    name: Test
    if: github.repository == 'NVIDIA/earth2studio'
    needs: lint
    runs-on: linux-amd64-gpu-h100-latest-1
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.2
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run test job
        uses: ./.github/actions/run-ci-test
        with:
          tox-env: test
          save-model-cache: "false"
          save-testmon-cache: "false"

  test-px-models:
    name: Test prognostic models
    if: github.repository == 'NVIDIA/earth2studio' && needs.changes.outputs.px_models == 'true'
    needs:
      - lint
      - changes
    runs-on: linux-amd64-gpu-h100-latest-1
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.2
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run test job
        uses: ./.github/actions/run-ci-test
        with:
          tox-env: test-px-models
          save-model-cache: "false"
          save-testmon-cache: "false"

  test-dx-models:
    name: Test diagnostic models
    if: github.repository == 'NVIDIA/earth2studio' && needs.changes.outputs.dx_models == 'true'
    needs:
      - lint
      - changes
    runs-on: linux-amd64-gpu-h100-latest-1
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.2
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run test job
        uses: ./.github/actions/run-ci-test
        with:
          tox-env: test-dx-models
          save-model-cache: "false"
          save-testmon-cache: "false"

  test-data:
    name: Test data sources
    if: github.repository == 'NVIDIA/earth2studio' && needs.changes.outputs.data == 'true'
    needs:
      - lint
      - changes
    runs-on: linux-amd64-gpu-h100-latest-1
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.2
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run test job
        uses: ./.github/actions/run-ci-test
        with:
          tox-env: test-data
          save-model-cache: "false"
          save-testmon-cache: "false"

  test-perturb:
    name: Test perturbation methods
    if: github.repository == 'NVIDIA/earth2studio' && needs.changes.outputs.perturb == 'true'
    needs:
      - lint
      - changes
    runs-on: linux-amd64-gpu-h100-latest-1
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.2
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run test job
        uses: ./.github/actions/run-ci-test
        with:
          tox-env: test-perturb
          save-model-cache: "false"
          save-testmon-cache: "false"

  test-stats:
    name: Test statistics and metrics
    if: github.repository == 'NVIDIA/earth2studio' && needs.changes.outputs.stats == 'true'
    needs:
      - lint
      - changes
    runs-on: linux-amd64-gpu-h100-latest-1
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.2
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run test job
        uses: ./.github/actions/run-ci-test
        with:
          tox-env: test-stats
          save-model-cache: "false"
          save-testmon-cache: "false"

  test-da-models:
    name: Test data assimilation models
    if: github.repository == 'NVIDIA/earth2studio' && needs.changes.outputs.da_models == 'true'
    needs:
      - lint
      - changes
    runs-on: linux-amd64-gpu-h100-latest-1
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.2
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run test job
        uses: ./.github/actions/run-ci-test
        with:
          tox-env: test-da-models
          save-model-cache: "false"
          save-testmon-cache: "false"

  test-px-models-conflicts:
    name: Test model conflict environments
    if: github.repository == 'NVIDIA/earth2studio' && needs.changes.outputs.px_models == 'true'
    needs:
      - lint
      - changes
    runs-on: linux-amd64-gpu-h100-latest-1
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.2
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run test job
        uses: ./.github/actions/run-ci-test
        with:
          tox-env: test-px-models-conflicts
          save-model-cache: "false"
          save-testmon-cache: "false"

  test-serve:
    name: Test serve
    if: github.repository == 'NVIDIA/earth2studio' && needs.changes.outputs.serve == 'true'
    needs:
      - lint
      - changes
    runs-on: linux-amd64-gpu-h100-latest-1
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.2
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run test job
        uses: ./.github/actions/run-ci-test
        with:
          tox-env: test-serve
          save-model-cache: "false"
          save-testmon-cache: "false"

  coverage:
    name: Coverage
    if: github.repository == 'NVIDIA/earth2studio' && always()
    needs:
      - test
      - test-px-models
      - test-dx-models
      - test-data
      - test-perturb
      - test-stats
      - test-da-models
      - test-px-models-conflicts
      - test-serve
    runs-on: linux-amd64-cpu8
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up environment
        run: uv sync

      - name: Download coverage data
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Generate coverage report
        run: |
          if ! compgen -G ".coverage.*" > /dev/null; then
            echo "No coverage data artifacts found." | tee coverage-report.txt
            exit 0
          fi

          make coverage | tee coverage-report.txt

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage-report.txt
            .coverage
          include-hidden-files: true
          if-no-files-found: ignore
