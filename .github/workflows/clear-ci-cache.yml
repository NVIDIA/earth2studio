name: Clear CI Cache

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List matching caches without deleting them
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  clear-uv-cache:
    name: Clear uv cache
    runs-on: ubuntu-latest
    steps:
      - name: Clear uv caches
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mapfile -t cache_ids < <(
            gh cache list \
              --repo "$GITHUB_REPOSITORY" \
              --key e2s-uv- \
              --limit 1000 \
              --json id \
              --jq '.[].id'
          )

          if [ "${#cache_ids[@]}" -eq 0 ]; then
            echo "No uv caches found."
            exit 0
          fi

          for cache_id in "${cache_ids[@]}"; do
            if [ "$DRY_RUN" = "true" ]; then
              echo "Would delete cache ${cache_id}"
            else
              gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY"
            fi
          done
