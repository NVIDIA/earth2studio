name: tmp-fork-api-docs

on:
  push:
    branches:
      - mkdocs-upgrade
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

defaults:
  run:
    shell: bash

concurrency:
  group: tmp-fork-api-docs-pages
  cancel-in-progress: true

env:
  UV_PYTHON: "3.13.13"

jobs:
  build-and-deploy:
    name: Build and deploy API docs
    if: github.repository == 'NickGeneva/earth2studio'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore uv cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ~/.cache/uv
          key: tmp-fork-api-docs-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            tmp-fork-api-docs-uv-${{ runner.os }}-

      - name: Install docs dependencies
        run: uv sync --python "$UV_PYTHON" --locked --group docs

      - name: Generate API markdown
        run: uv run python docs/generate_api.py

      - name: Generate install selector data
        run: uv run python docs/generate_install_options.py

      - name: Generate examples gallery
        run: uv run python docs/generate_gallery.py

      - name: Prepare preview docs config
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          config = (root / "mkdocs.yml").read_text(encoding="utf-8")
          config = config.replace(
              "site_url: https://nvidia.github.io/earth2studio/",
              "site_url: https://nickgeneva.github.io/earth2studio/",
          )
          config = config.replace(
              "repo_name: NVIDIA/earth2studio",
              "repo_name: NickGeneva/earth2studio",
          )
          config = config.replace(
              "repo_url: https://github.com/NVIDIA/earth2studio",
              "repo_url: https://github.com/NickGeneva/earth2studio",
          )
          config = config.replace("edit_uri: edit/main/docs/", "edit_uri: edit/mkdocs-upgrade/docs/")
          config = config.replace("  version:\n    provider: mike\n", "")

          def remove_plugin(text: str, plugin: str) -> str:
              lines = text.splitlines()
              out = []
              i = 0
              marker = f"- {plugin}:"
              while i < len(lines):
                  if lines[i] == marker:
                      i += 1
                      while i < len(lines) and not (
                          lines[i].startswith("- ")
                          or (
                              lines[i]
                              and not lines[i][0].isspace()
                              and lines[i].endswith(":")
                          )
                      ):
                          i += 1
                      continue
                  out.append(lines[i])
                  i += 1
              return "\n".join(out) + "\n"

          for plugin in ("mike",):
              config = remove_plugin(config, plugin)

          (root / "mkdocs.fork-api.yml").write_text(config, encoding="utf-8")
          PY

      - name: Build docs preview
        run: uv run zensical build --clean --config-file mkdocs.fork-api.yml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save uv cache
        if: always()
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ~/.cache/uv
          key: tmp-fork-api-docs-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
