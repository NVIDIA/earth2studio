name: util-clear-cache

on:
  workflow_dispatch:
    inputs:
      cache:
        description: Cache group to delete
        required: true
        default: all
        type: choice
        options:
          - all
          - uv
          - pre-commit
          - model
          - testmon
      dry_run:
        description: List matching caches without deleting them
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  util-clear-cache:
    name: util-clear-cache
    runs-on: ubuntu-latest
    steps:
      - name: Clear selected cache
        env:
          CACHE_GROUP: ${{ inputs.cache }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          case "$CACHE_GROUP" in
            all)
              key_regex="^e2s-(uv|pre-commit|model|testmon)-"
              ;;
            uv)
              key_regex="^e2s-uv-"
              ;;
            pre-commit)
              key_regex="^e2s-pre-commit-"
              ;;
            model)
              key_regex="^e2s-model-"
              ;;
            testmon)
              key_regex="^e2s-testmon-"
              ;;
            *)
              echo "Unknown cache group: $CACHE_GROUP"
              exit 1
              ;;
          esac

          mapfile -t cache_lines < <(
            gh cache list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 1000 \
              --json id,key \
              --jq ".[] | select(.key | test(\"${key_regex}\")) | [.id, .key] | @tsv"
          )

          if [ "${#cache_lines[@]}" -eq 0 ]; then
            echo "No ${CACHE_GROUP} caches found."
            exit 0
          fi

          for cache_line in "${cache_lines[@]}"; do
            cache_id="${cache_line%%$'\t'*}"
            cache_key="${cache_line#*$'\t'}"
            if [ "$DRY_RUN" = "true" ]; then
              echo "Would delete cache ${cache_id}: ${cache_key}"
            else
              echo "Deleting cache ${cache_id}: ${cache_key}"
              gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY"
            fi
          done
