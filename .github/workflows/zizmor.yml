# Audits GitHub Actions workflows with zizmor and uploads findings to
# GitHub code scanning (Security tab).
name: zizmor

on:
  push:
    branches:
      - main
      - "pull-request/**"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Audit workflows
    if: github.repository == 'NVIDIA/earth2studio'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # zizmor exits 0 with no findings and 10-14 when findings exist;
        # findings are reported through code scanning, not the job status.
        run: |
          pipx run zizmor==1.29.0 --format=sarif .github/ > zizmor.sarif && ec=0 || ec=$?
          if [ "$ec" -ne 0 ] && [ "$ec" -lt 10 ]; then
            exit "$ec"
          fi

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: zizmor.sarif
          category: zizmor
