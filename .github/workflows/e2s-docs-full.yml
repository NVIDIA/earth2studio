name: e2s-docs-full

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

concurrency:
  group: e2s-docs-full-gh-pages
  cancel-in-progress: false

env:
  E2S_CI_IMAGE: &e2s_ci_image ghcr.io/nvidia/earth2studio-ci:0.2
  CDSAPI_URL: https://cds.climate.copernicus.eu/api
  DOC_PUBLIC_BUILD: "false"
  EARTH2STUDIO_CACHE: ${{ github.workspace }}/.cache/earth2studio
  EARTH2STUDIO_DATA_CACHE: ${{ github.workspace }}/.cache/earth2studio-data
  EARTH2STUDIO_MODEL_CACHE: ${{ github.workspace }}/.cache/earth2studio-models
  TORCH_ALLOW_TF32_CUBLAS_OVERRIDE: "1"
  UV_PYTHON: "3.13.13"

jobs:
  build-docs:
    name: Build full docs
    if: github.repository == 'NVIDIA/earth2studio' && github.ref_type == 'branch' && (github.ref_name == github.event.repository.default_branch || endsWith(github.ref_name, '-rc'))
    outputs:
      doc-version: ${{ steps.docs-meta.outputs.doc-version }}
      is-rc: ${{ steps.docs-meta.outputs.is-rc }}
      publish-path: ${{ steps.docs-meta.outputs.publish-path }}
    runs-on: linux-amd64-gpu-h100-latest-1
    timeout-minutes: 180
    container:
      image: *e2s_ci_image
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      FLASH_ATTN_CUDA_ARCHS: "90"
      MAX_JOBS: "8"
      NATTEN_CUDA_ARCH: "9.0"
      NATTEN_N_WORKERS: "8"
      NVCC_THREADS: "2"
    steps:
      - name: Resolve docs version
        id: docs-meta
        run: |
          set -euo pipefail

          default_branch="${{ github.event.repository.default_branch }}"
          ref_name="${GITHUB_REF_NAME##*/}"
          doc_version="main"
          is_rc="false"
          publish_path="."

          if [[ "$GITHUB_REF_NAME" == "$default_branch" ]]; then
            :
          elif [[ "$ref_name" =~ ^([0-9]+[.][0-9]+[.][0-9]+[0-9A-Za-z._]*)-rc$ ]]; then
            doc_version="${BASH_REMATCH[1]}"
            is_rc="true"
            publish_path="v/${doc_version}"
          else
            echo "Ref '${GITHUB_REF_NAME}' is not a trusted docs publication ref." >&2
            exit 1
          fi

          echo "DOC_VERSION=${doc_version}" >> "$GITHUB_ENV"
          echo "doc-version=${doc_version}" >> "$GITHUB_OUTPUT"
          echo "is-rc=${is_rc}" >> "$GITHUB_OUTPUT"
          echo "publish-path=${publish_path}" >> "$GITHUB_OUTPUT"

          echo "### Full docs build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- DOC_VERSION: \`${doc_version}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publish path: \`${publish_path}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore model cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ env.EARTH2STUDIO_MODEL_CACHE }}
          key: e2s-model-${{ runner.os }}-docs-full-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            e2s-model-${{ runner.os }}-docs-full-main-
            e2s-model-${{ runner.os }}-

      - name: Prepare CI directories
        run: python3 test/_ci/prepare_ci_paths.py

      - name: Show GPU information
        run: nvidia-smi

      - name: Check uv lockfile
        run: uv lock --check

      - name: Build docs examples by section
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          EARTHMOVER_API_KEY: ${{ secrets.EARTHMOVER_API_KEY }}
          EARTHMOVER_ORGANIZATION: ${{ secrets.EARTHMOVER_ORGANIZATION }}
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: test/_ci/build_docs_examples.sh

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-full-html
          path: docs/_build/html/
          if-no-files-found: error
          retention-days: 10

      - name: Save model cache
        if: always()
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ env.EARTH2STUDIO_MODEL_CACHE }}
          key: e2s-model-${{ runner.os }}-docs-full-main-${{ github.run_id }}-${{ github.run_attempt }}

  publish-docs:
    name: Publish full docs
    if: github.repository == 'NVIDIA/earth2studio' && github.ref_type == 'branch' && (github.ref_name == github.event.repository.default_branch || endsWith(github.ref_name, '-rc'))
    permissions:
      contents: write
      packages: read
    needs: build-docs
    runs-on: linux-amd64-cpu8
    environment:
      name: docs-publish
    container:
      image: *e2s_ci_image
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GH_PAGES_FOLDER: ${{ runner.temp }}/gh-pages
      DOC_VERSION: ${{ needs.build-docs.outputs.doc-version }}
      PUBLISH_PATH: ${{ needs.build-docs.outputs.publish-path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-full-html
          path: docs/_build/html

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          rm -rf "$GH_PAGES_FOLDER"
          git clone \
            --single-branch \
            --depth 1 \
            --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$GH_PAGES_FOLDER"

          target_dir="$GH_PAGES_FOLDER"
          if [ "$PUBLISH_PATH" != "." ]; then
            target_dir="$GH_PAGES_FOLDER/$PUBLISH_PATH"
          fi

          mkdir -p "$target_dir"
          rsync -a --delete docs/_build/html/ "$target_dir/"

          git_sha_short=$(git rev-parse --short HEAD)
          cd "$GH_PAGES_FOLDER"
          git add --all

          if git diff --cached --quiet; then
            echo "No docs changes to publish."
            exit 0
          fi

          git commit -m "[CI] Full Docs Build ${DOC_VERSION} ${git_sha_short}"
          git push origin gh-pages
