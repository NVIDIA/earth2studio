name: CI

on:
  push:
    branches:
      - main
      - "pull-request/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv

jobs:
  setup-env:
    name: Set up environment
    runs-on: linux-amd64-cpu8
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore uv cache
        id: uv-cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: e2s-uv-ghcr-0.1-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            e2s-uv-ghcr-0.1-${{ runner.os }}-

      - name: Set up environment
        run: uv sync

      - name: Save uv cache
        if: >
          (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
          steps.uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: e2s-uv-ghcr-0.1-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

  format:
    name: Format
    needs: setup-env
    runs-on: linux-amd64-cpu8
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore uv cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: e2s-uv-ghcr-0.1-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            e2s-uv-ghcr-0.1-${{ runner.os }}-

      - name: Set up environment
        run: uv sync

      - name: Check formatting
        run: make format

  lint:
    name: Lint
    needs: format
    runs-on: linux-amd64-cpu8
    container:
      image: ghcr.io/nvidia/earth2studio-ci:0.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore uv cache
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: e2s-uv-ghcr-0.1-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            e2s-uv-ghcr-0.1-${{ runner.os }}-

      - name: Set up environment
        run: uv sync

      - name: Check docstring coverage
        run: make interrogate

      - name: Run lint checks
        run: make lint

      - name: Check license headers
        run: make license
