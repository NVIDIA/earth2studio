# Harbor execution policy for earth2studio-create-datasource live evals.
#
# Grading is trajectory + LLM-as-judge (accuracy, behavior_check) comparing
# generated code against reference targets. No live pytest execution required.
#
# Local run:
#   skillevaluator evaluate skills/earth2studio-create-datasource \
#     -a claude-code,codex -o ./eval-results/
#
# Validate before committing:
#   skillevaluator validate ./skills/earth2studio-create-datasource

schema_version: 1

harbor:
  n_attempts: 2
  pass_threshold: 0.60
  stop_on_pass: false
  n_concurrent: 4
  timeout_multiplier: 4.0

skill_workspace:
  mode: isolated

grading:
  mode: aces_default
