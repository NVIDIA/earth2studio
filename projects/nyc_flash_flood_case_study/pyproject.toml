[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-flash-flood-case-study"
version = "0.1.0"
description = "Case study workflow for a compact NYC flash-flood susceptibility analysis using Earth2Studio forcing."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "xarray>=2024.1",
  "netCDF4>=1.6",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "rasterio>=1.3",
  "pyproj>=3.5",
  "shapely>=2.0",
  "geopandas>=0.14",
  "requests>=2.31",
  "folium>=0.14",
  "joblib>=1.3",
]

[project.optional-dependencies]
swmm = ["pyswmm>=2.1"]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
